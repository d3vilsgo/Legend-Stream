name: Recovery wordlist staging verification

on:
  push:
    branches:
      - fix/recovery-phrase-eff-wordlist

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: pnpm --filter @workspace/legendstream-xplayer... install --no-frozen-lockfile

      - name: Backup security scenarios
        run: pnpm --filter @workspace/legendstream-xplayer test:backup

      - name: Mobile typecheck
        run: pnpm --filter @workspace/legendstream-xplayer typecheck
