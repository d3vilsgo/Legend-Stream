      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies into isolated store
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --store-dir "$RECOVERY_DIR/store"
          git diff --exit-code -- pnpm-lock.yaml
          pnpm store path --store-dir "$RECOVERY_DIR/store"
          node --version
          pnpm --version
      - name: Verify offline store in a clean workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECOVERY_DIR/offline"
          tar -xzf "$RECOVERY_DIR/source/source.tar.gz" -C "$RECOVERY_DIR/offline"
          cd "$RECOVERY_DIR/offline"
          pnpm install --offline --frozen-lockfile --store-dir "$RECOVERY_DIR/store"
          cmp pnpm-lock.yaml "$GITHUB_WORKSPACE/pnpm-lock.yaml"
          pnpm exec prettier --check artifacts/legendstream-xplayer/components/home/HomeDiscovery.tsx artifacts/legendstream-xplayer/lib/design/eliteV3Tokens.ts artifacts/legendstream-xplayer/tests/u42HomeCollapsibleHostScenarios.mjs artifacts/legendstream-xplayer/scripts/build-home-review.mjs
          pnpm run typecheck
          node artifacts/legendstream-xplayer/tests/u42HomeCollapsibleHostScenarios.mjs
      - name: Package store and matching Linux toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECOVERY_DIR/toolchain/bin" "$RECOVERY_DIR/toolchain/pnpm"
          cp "$(command -v node)" "$RECOVERY_DIR/toolchain/bin/node"
          PNPM_VERSION="$(pnpm --version)"
          npm pack "pnpm@$PNPM_VERSION" --pack-destination "$RECOVERY_DIR/toolchain/pnpm" --ignore-scripts >/dev/null
          tar -xzf "$RECOVERY_DIR/toolchain/pnpm/pnpm-$PNPM_VERSION.tgz" -C "$RECOVERY_DIR/toolchain/pnpm"
          rm "$RECOVERY_DIR/toolchain/pnpm/pnpm-$PNPM_VERSION.tgz"
          printf '%s\n' '#!/bin/sh' 'exec node "$(dirname "$0")/../pnpm/package/bin/pnpm.cjs" "$@"' > "$RECOVERY_DIR/toolchain/bin/pnpm"
          chmod +x "$RECOVERY_DIR/toolchain/bin/pnpm"
          test "$("$RECOVERY_DIR/toolchain/bin/node" "$RECOVERY_DIR/toolchain/pnpm/package/bin/pnpm.cjs" --version)" = "$PNPM_VERSION"
          export PNPM_VERSION
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess, tarfile
          root = pathlib.Path(os.environ['RECOVERY_DIR'])
          # pnpm 10 registerProject stores runner-specific GC registry links, not package bytes.
          # Only unlink exact known project registrations; never follow/copy their targets.
          registry = root / 'store/v10/projects'
          omitted_registry_links = []
          if registry.exists() or registry.is_symlink():
              assert registry.is_dir() and not registry.is_symlink(), 'Invalid project registry'
              assert registry.resolve() == root.resolve() / 'store/v10/projects', 'Redirected registry parent'
              allowed_projects = {pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(),
                                  (root / 'offline').resolve()}
              for link in sorted(registry.iterdir()):
                  assert link.is_symlink(), 'Unexpected project registry entry: ' + link.name
                  raw_target = os.readlink(link)
                  assert not os.path.isabs(raw_target), 'Absolute project registry target'
                  target = (link.parent / raw_target).resolve(strict=True)
                  assert target in allowed_projects and target.is_dir(), 'Unknown project registry target'
                  assert raw_target == os.path.relpath(target, link.parent), 'Noncanonical project registry target'
                  assert link.name == hashlib.sha256(str(target).encode()).hexdigest()[:32], 'Project registry hash mismatch'
                  omitted_registry_links.append({'path': str(link.relative_to(root)),
                                                 'target': raw_target, 'resolved_target': str(target),
                                                 'reason': 'regenerable-pnpm-project-registration'})
              # Validate every entry before removing any; unlink only the directory entry.
              for item in omitted_registry_links:
                  (root / item['path']).unlink()
          records = []
          for directory in ('store', 'toolchain'):
              for p in sorted((root / directory).rglob('*')):
                  assert not p.is_symlink(), 'Nonportable symlink: ' + str(p.relative_to(root))
                  if p.is_file():
                      records.append({'path': str(p.relative_to(root)), 'size': p.stat().st_size,
                                      'mode': oct(p.stat().st_mode & 0o777),
                                      'sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest = {'format': 1, 'source_commit_sha': os.environ['SOURCE_SHA'],
                      'workflow_commit_sha': os.environ['WORKFLOW_SHA'],
                      'node': subprocess.check_output(['node', '--version']).decode().strip(),
                      'pnpm': os.environ['PNPM_VERSION'], 'platform': platform.platform(),
                      'architecture': platform.machine(), 'libc': platform.libc_ver(),
                      'lockfile_sha256': hashlib.sha256(pathlib.Path('pnpm-lock.yaml').read_bytes()).hexdigest(),
                      'offline_runner_install': 'passed', 'node_modules_included': False,
                      'omitted_registry_links': omitted_registry_links,
                      'portability': 'Linux matching architecture/libc only; Work offline verification still required',
                      'files': records}
          (root / 'dependencies/dependency-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with tarfile.open(root / 'dependencies/dependencies.tar.gz', 'w:gz', dereference=False) as archive:
              for directory in ('store', 'toolchain'):
                  archive.add(root / directory, arcname=directory)
          PY
      - name: Verify packaged store without runner registrations
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$RECOVERY_DIR/transfer-probe"
          mkdir -p "$PROBE/dependencies" "$PROBE/workspace"
          tar -xzf "$RECOVERY_DIR/dependencies/dependencies.tar.gz" -C "$PROBE/dependencies"
          tar -xzf "$RECOVERY_DIR/source/source.tar.gz" -C "$PROBE/workspace"
          export PATH="$PROBE/dependencies/toolchain/bin:$PATH"
          cd "$PROBE/workspace"
          pnpm install --offline --frozen-lockfile --store-dir "$PROBE/dependencies/store"
          cmp pnpm-lock.yaml "$GITHUB_WORKSPACE/pnpm-lock.yaml"
          node artifacts/legendstream-xplayer/tests/u42HomeCollapsibleHostScenarios.mjs
      - name: Hash payloads
        id: package_paths
        shell: bash
        run: |
          set -euo pipefail
          for directory in source dependencies; do
            cd "$RECOVERY_DIR/$directory"
            sha256sum *.tar.gz *manifest.json > SHA256SUMS
          done
          printf 'source=%s\ndependencies=%s\n' "$(realpath "$RECOVERY_DIR/source")" "$(realpath "$RECOVERY_DIR/dependencies")" >> "$GITHUB_OUTPUT"
          printf 'source_commit_sha=%s\nworkflow_commit_sha=%s\n' "$SOURCE_SHA" "$WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: workspace-recovery-source-${{ inputs.source_sha }}
          path: ${{ steps.package_paths.outputs.source }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload dependency store
        uses: actions/upload-artifact@v4
        with:
          name: workspace-recovery-dependencies-${{ inputs.source_sha }}
          path: ${{ steps.package_paths.outputs.dependencies }}
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
