name: Workspace Recovery V1

on:
  push:
    branches:
      - integration/legendstream-u1
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-character application source commit SHA"
        required: true
        default: "4281ce70473fbc20db550a69b35974c30495af68"
        type: string

permissions:
  contents: read

jobs:
  recover:
    if: github.ref == 'refs/heads/integration/legendstream-u1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
      RECOVERY_DIR: ${{ github.workspace }}/../workspace-recovery-${{ github.run_id }}
    steps:
      - name: Validate requested commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$RECOVERY_DIR/source" "$RECOVERY_DIR/dependencies"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify and package exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, tarfile
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = os.environ['SOURCE_SHA']
          assert git('rev-parse', 'HEAD').decode().strip() == expected, 'Wrong checkout'
          assert not git('status', '--porcelain'), 'Checkout is dirty'
          output = pathlib.Path(os.environ['RECOVERY_DIR']) / 'source'
          files = []
          sensitive = []
          # Conservative fail-closed policy: never redact or omit a tracked blob silently.
          secret_patterns = [
              rb'-----BEGIN (?:[A-Z ]*PRIVATE KEY|CERTIFICATE)-----',
              rb'(?:gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})',
              rb'AKIA[0-9A-Z]{16}',
              rb'''(?i)(?:password|passwd|secret|api[_-]?key|auth[_-]?token)\s*[:=]\s*["'][^"'\r\n]{8,}["']''',
              rb'https?://[^\s/]+:[^\s/@]+@',
              rb'https?://[^\s]+[?&](?:password|token|access_token|api_key)=[^\s&]+',
              rb'https?://[^\s]+/(?:live|movie|series)/[^/\s]+/[^/\s]+/',
          ]
          # Reviewed at source commit 4281ce70473fbc20db550a69b35974c30495af68.
          # Exact path + whole-file digest + complete rule/match multiset; never a directory exemption.
          reviewed_matches = {
