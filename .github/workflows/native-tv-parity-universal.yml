name: Native TV parity Universal APK dispatch
on:
  push:
    branches: [feature/r18-native-tv-remote-player-parity]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.ref.replace('refs/heads/', '');
            const current = await github.rest.git.getRef({ owner, repo, ref: `heads/${ref}` });
            if (current.data.object.sha !== context.sha) throw new Error('Branch moved; refuse stale APK dispatch');
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'android-apk.yml', ref,
              inputs: { apk_mode: 'universal', dual_abi: 'false', catalog_benchmark: 'false' }
            });
