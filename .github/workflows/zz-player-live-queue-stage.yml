name: Player Live Queue Stage

on:
  push:
    branches: [fix/player-live-queue]
    paths:
      - .github/workflows/zz-player-live-queue-stage.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-live-queue
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply stable live queue integration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              file.write_text(text.replace(old, new, 1))

          home = "artifacts/legendstream-xplayer/components/OptimizedHomeScreenV6.tsx"
          replace_exact(
              home,
              'import { getCachedLiveItems, getCachedSeriesItems, getCachedVodItems } from "@/lib/catalogRuntime";\n',
              'import { getCachedLiveItems, getCachedSeriesItems, getCachedVodItems } from "@/lib/catalogRuntime";\nimport type { LiveChannelIdentity } from "@/lib/playerLiveQueue";\n',
          )
          replace_exact(
              home,
              '''type Playable = {\n  title: string;\n  url: string;\n  subtitle?: string;\n  kind: "live" | "movie" | "episode" | "download";\n  returnTo: ContentView;\n};''',
              '''type Playable = {\n  title: string;\n  url: string;\n  subtitle?: string;\n  kind: "live" | "movie" | "episode" | "download";\n  returnTo: ContentView;\n  liveIdentity?: LiveChannelIdentity;\n};''',
          )
          replace_exact(
              home,
              '''    setPlayable({ title: channel.name, subtitle: channel.category, url: channel.streamUrl, kind: "live", returnTo: "live" });''',
              '''    setPlayable({\n      title: channel.name,\n      subtitle: channel.category,\n      url: channel.streamUrl,\n      kind: "live",\n      returnTo: "live",\n      liveIdentity: { providerId: channel.providerId, channelId: channel.id },\n    });''',
          )
          replace_exact(
              home,
              '''      {playable ? <NativeVideoPlayer\n        source={playable.url}\n        title={playable.title}\n        autoFullscreen\n        allowDownload={playable.kind === "movie" || playable.kind === "episode"}\n        onFullscreenExit={() => setView(playable.returnTo)}\n      /> : null}''',
              '''      {playable ? <NativeVideoPlayer\n        source={playable.url}\n        title={playable.title}\n        mediaKind={playable.kind}\n        liveIdentity={playable.liveIdentity}\n        autoFullscreen\n        allowDownload={playable.kind === "movie" || playable.kind === "episode"}\n        onFullscreenExit={() => setView(playable.returnTo)}\n      /> : null}''',
          )

          player = "artifacts/legendstream-xplayer/components/CompatibilityVideoPlayerV2.tsx"
          replace_exact(
              player,
              'import { resolveCatalogRuntimeSource } from "@/lib/catalogRuntime";\n',
              'import { getCachedLiveItems, resolveCatalogRuntimeSource } from "@/lib/catalogRuntime";\nimport {\n  liveQueueIndex,\n  resolveLiveQueue,\n  type LiveChannelIdentity,\n} from "@/lib/playerLiveQueue";\nimport type { Channel } from "@/lib/iptv";\n',
          )
          replace_exact(
              player,
              '''  mediaKind,\n  autoFullscreen = true,''',
              '''  mediaKind,\n  liveIdentity,\n  autoFullscreen = true,''',
          )
          replace_exact(
              player,
              '''  mediaKind?: PlayerMediaKind;\n  autoFullscreen?: boolean;''',
              '''  mediaKind?: PlayerMediaKind;\n  liveIdentity?: LiveChannelIdentity;\n  autoFullscreen?: boolean;''',
          )
          replace_exact(
              player,
              '''  const [currentKind, setCurrentKind] = useState<PlayerMediaKind>(initialKind);\n  const [paused, setPaused] = useState(false);''',
              '''  const [currentKind, setCurrentKind] = useState<PlayerMediaKind>(initialKind);\n  const [currentLiveIdentity, setCurrentLiveIdentity] = useState<LiveChannelIdentity | null>(\n    initialKind === "live" ? liveIdentity ?? null : null,\n  );\n  const [cachedLiveChannels, setCachedLiveChannels] = useState<Channel[]>([]);\n  const [paused, setPaused] = useState(false);''',
          )
          replace_exact(
              player,
              '''  const currentLive = useMemo(\n    () => currentKind === "live" && provider\n      ? channels.find((channel) => channel.providerId === provider.id && channel.streamUrl === currentSource)\n      : undefined,\n    [channels, currentKind, currentSource, provider],\n  );''',
              '''  useEffect(() => {\n    let cancelled = false;\n    if (\n      currentKind !== "live" ||\n      !currentLiveIdentity ||\n      !provider ||\n      provider.id !== currentLiveIdentity.providerId ||\n      provider.type !== "xtream" ||\n      liveQueueIndex(channels, currentLiveIdentity) >= 0\n    ) {\n      setCachedLiveChannels([]);\n      return () => { cancelled = true; };\n    }\n    void getCachedLiveItems(provider)\n      .then((items) => {\n        if (!cancelled) setCachedLiveChannels(items);\n      })\n      .catch(() => {\n        if (!cancelled) setCachedLiveChannels([]);\n      });\n    return () => { cancelled = true; };\n  }, [channels, currentKind, currentLiveIdentity, provider]);\n\n  const liveQueue = useMemo(\n    () => currentKind === "live"\n      ? resolveLiveQueue(channels, cachedLiveChannels, currentLiveIdentity)\n      : [],\n    [cachedLiveChannels, channels, currentKind, currentLiveIdentity],\n  );\n  const currentLiveIndex = useMemo(\n    () => liveQueueIndex(liveQueue, currentLiveIdentity),\n    [currentLiveIdentity, liveQueue],\n  );\n  const currentLive = currentLiveIndex >= 0 ? liveQueue[currentLiveIndex] : undefined;''',
          )
          replace_exact(
              player,
              '''  const liveQueue = useMemo(() => {\n    if (!provider || !currentLive) return [];\n    const sameCategory = channels.filter(\n      (channel) => channel.providerId === provider.id && channel.category === currentLive.category,\n    );\n    return sameCategory.length\n      ? sameCategory\n      : channels.filter((channel) => channel.providerId === provider.id);\n  }, [channels, currentLive, provider]);\n\n''',
              '',
          )
          replace_exact(
              player,
              '''        source: channel.streamUrl,\n        isLive: true,''',
              '''        source: channel.streamUrl,\n        isLive: true,''',
          )
          replace_exact(
              player,
              '''  const currentIndex = useMemo(\n    () => selectableItems.findIndex((item) => item.source === currentSource),\n    [currentSource, selectableItems],\n  );''',
              '''  const currentIndex = useMemo(\n    () => currentKind === "live"\n      ? currentLiveIndex\n      : selectableItems.findIndex((item) => item.source === currentSource),\n    [currentKind, currentLiveIndex, currentSource, selectableItems],\n  );''',
          )
          replace_exact(
              player,
              '''    setCurrentKind(kind);\n    setPosition(0);''',
              '''    setCurrentKind(kind);\n    setCurrentLiveIdentity(\n      item.isLive && provider\n        ? { providerId: provider.id, channelId: item.id }\n        : null,\n    );\n    setPosition(0);''',
          )
          replace_exact(
              player,
              '''  }, [persistProgress, recordWatched, revealControls, revealMediaInfo]);''',
              '''  }, [persistProgress, provider, recordWatched, revealControls, revealMediaInfo]);''',
          )

          chrome = "artifacts/legendstream-xplayer/components/player/PlayerChrome.tsx"
          replace_exact(
              chrome,
              '''  Pressable,\n  StyleSheet,''',
              '''  Pressable,\n  ScrollView,\n  StyleSheet,''',
          )
          replace_exact(
              chrome,
              '''  accent?: boolean;\n  onPress: () => void;''',
              '''  accent?: boolean;\n  disabled?: boolean;\n  onPress: () => void;''',
          )
          old_actions = '''  const actions: Action[] = [\n    ...(chrome.selectableItems.length ? [{\n      key: "list",\n      label: chrome.mediaKind === "live" ? "Kanallar" : "Liste",\n      icon: "list" as FeatherName,\n      active: chrome.panel === "content",\n      onPress: () => chrome.onTogglePanel("content"),\n    }] : []),'''
          new_actions = '''  const liveNavigationActions: Action[] = chrome.mediaKind === "live" && chrome.selectableItems.length\n    ? [\n        {\n          key: "previous",\n          label: "Önceki kanal",\n          icon: "skip-back" as FeatherName,\n          disabled: chrome.currentIndex <= 0,\n          onPress: () => chrome.onMoveRelative(-1),\n        },\n        {\n          key: "list",\n          label: "Kanallar",\n          icon: "list" as FeatherName,\n          active: chrome.panel === "content",\n          onPress: () => chrome.onTogglePanel("content"),\n        },\n        {\n          key: "next",\n          label: "Sonraki kanal",\n          icon: "skip-forward" as FeatherName,\n          disabled: chrome.currentIndex < 0 || chrome.currentIndex >= chrome.selectableItems.length - 1,\n          onPress: () => chrome.onMoveRelative(1),\n        },\n      ]\n    : [];\n\n  const actions: Action[] = [\n    ...liveNavigationActions,\n    ...(chrome.mediaKind !== "live" && chrome.selectableItems.length ? [{\n      key: "list",\n      label: "Liste",\n      icon: "list" as FeatherName,\n      active: chrome.panel === "content",\n      onPress: () => chrome.onTogglePanel("content"),\n    }] : []),'''
          replace_exact(chrome, old_actions, new_actions)
          replace_exact(
              chrome,
              '''          {chrome.mediaKind !== "live" ? (\n            <RoundButton\n              icon="rotate-ccw"\n              badge="10"\n              label="10 saniye geri"\n              onPress={() => chrome.onSeekBy(-10)}\n              size={Math.round((portrait ? 54 : 58) * uiScale)}\n              iconSize={Math.round((portrait ? 27 : 30) * uiScale)}\n            />\n          ) : chrome.canNavigate ? (\n            <RoundButton\n              icon="skip-back"\n              label="Önceki kanal"\n              onPress={() => chrome.onMoveRelative(-1)}\n              size={Math.round((portrait ? 54 : 58) * uiScale)}\n              iconSize={Math.round((portrait ? 27 : 30) * uiScale)}\n            />\n          ) : null}''',
              '''          {chrome.mediaKind !== "live" ? (\n            <RoundButton\n              icon="rotate-ccw"\n              badge="10"\n              label="10 saniye geri"\n              onPress={() => chrome.onSeekBy(-10)}\n              size={Math.round((portrait ? 54 : 58) * uiScale)}\n              iconSize={Math.round((portrait ? 27 : 30) * uiScale)}\n            />\n          ) : null}''',
          )
          replace_exact(
              chrome,
              '''          {chrome.mediaKind !== "live" ? (\n            <RoundButton\n              icon="rotate-cw"\n              badge="15"\n              label="15 saniye ileri"\n              onPress={() => chrome.onSeekBy(15)}\n              size={Math.round((portrait ? 54 : 58) * uiScale)}\n              iconSize={Math.round((portrait ? 27 : 30) * uiScale)}\n            />\n          ) : chrome.canNavigate ? (\n            <RoundButton\n              icon="skip-forward"\n              label="Sonraki kanal"\n              onPress={() => chrome.onMoveRelative(1)}\n              size={Math.round((portrait ? 54 : 58) * uiScale)}\n              iconSize={Math.round((portrait ? 27 : 30) * uiScale)}\n            />\n          ) : null}''',
              '''          {chrome.mediaKind !== "live" ? (\n            <RoundButton\n              icon="rotate-cw"\n              badge="15"\n              label="15 saniye ileri"\n              onPress={() => chrome.onSeekBy(15)}\n              size={Math.round((portrait ? 54 : 58) * uiScale)}\n              iconSize={Math.round((portrait ? 27 : 30) * uiScale)}\n            />\n          ) : null}''',
          )
          replace_exact(
              chrome,
              '''          <View style={[styles.dockRow, { gap }]}>\n            {actions.map((action) => (\n              <AdaptiveDockButton\n                key={action.key}\n                action={action}\n                size={buttonSize}\n                iconSize={dockIconSize}\n              />\n            ))}\n          </View>''',
              '''          <ScrollView\n            horizontal\n            showsHorizontalScrollIndicator={false}\n            contentContainerStyle={[styles.dockRow, { gap }]}\n          >\n            {actions.map((action) => (\n              <AdaptiveDockButton\n                key={action.key}\n                action={action}\n                size={buttonSize}\n                iconSize={dockIconSize}\n              />\n            ))}\n          </ScrollView>''',
          )
          replace_exact(
              chrome,
              '''      onPress={action.onPress}\n      hitSlop={Math.max(10, Math.ceil((50 - size) / 2))}\n      style={({ pressed }) => [styles.dockButton, { width: size, height: size }, pressed && styles.pressed]}''',
              '''      onPress={action.onPress}\n      disabled={action.disabled}\n      accessibilityState={{ disabled: Boolean(action.disabled) }}\n      hitSlop={Math.max(10, Math.ceil((50 - size) / 2))}\n      style={({ pressed }) => [\n        styles.dockButton,\n        { width: size, height: size },\n        action.disabled && styles.disabled,\n        pressed && !action.disabled && styles.pressed,\n      ]}''',
          )
          replace_exact(
              chrome,
              '''  dockRow: { width: "100%", flexDirection: "row", alignItems: "center", justifyContent: "center", backgroundColor: "transparent" },''',
              '''  dockRow: { flexGrow: 1, minWidth: "100%", flexDirection: "row", alignItems: "center", justifyContent: "center", backgroundColor: "transparent" },''',
          )
          replace_exact(
              chrome,
              '''  pressed: { opacity: 0.62, transform: [{ scale: 0.94 }] },''',
              '''  disabled: { opacity: 0.34 },\n  pressed: { opacity: 0.62, transform: [{ scale: 0.94 }] },''',
          )
          PY
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Player live queue regressions
        run: pnpm --filter @workspace/legendstream-xplayer test:player-live-queue
      - name: Catalog persistence regressions
        run: pnpm --filter @workspace/legendstream-xplayer test:catalog-persistence
      - name: Mobile typecheck
        run: pnpm --filter @workspace/legendstream-xplayer typecheck
      - name: Console guard
        run: node scripts/check-console-usage.mjs
      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/legendstream-xplayer/components/OptimizedHomeScreenV6.tsx \
                  artifacts/legendstream-xplayer/components/CompatibilityVideoPlayerV2.tsx \
                  artifacts/legendstream-xplayer/components/player/PlayerChrome.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(player): restore stable live queue controls"
          git push origin HEAD:fix/player-live-queue
