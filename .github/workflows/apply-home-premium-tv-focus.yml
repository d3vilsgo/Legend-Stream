name: Apply Home Premium TV Focus

on:
  push:
    branches:
      - feat/home-premium-tv-focus
    paths:
      - scripts/apply-home-premium-tv-focus.py
      - .github/workflows/apply-home-premium-tv-focus.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-premium-tv-focus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply-home-premium-tv-focus.py
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/legendstream-xplayer/components/OptimizedHomeScreenV6.tsx \
                  artifacts/legendstream-xplayer/components/FocusButton.tsx \
                  artifacts/legendstream-xplayer/components/ProviderSubscriptionChip.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(home): add premium TV focus language"
          git push
