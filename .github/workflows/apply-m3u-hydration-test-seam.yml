name: Apply M3U Hydration Test Seam

on:
  push:
    branches:
      - fix/m3u-hydration-yield
    paths:
      - .github/workflows/apply-m3u-hydration-test-seam.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3u-hydration-yield
      - name: Apply exact test seam replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_exact(
              "artifacts/legendstream-xplayer/lib/m3uCatalogHydration.ts",
              'import { yieldToUi } from "./cooperative";\n',
              '',
          )
          replace_exact(
              "artifacts/legendstream-xplayer/lib/m3uCatalogHydration.ts",
              'export type M3UDirectHydrationOptions = {\n  batchSize?: number;\n  yieldFn?: () => Promise<void>;\n};',
              'export type M3UDirectHydrationOptions = {\n  batchSize?: number;\n  yieldFn: () => Promise<void>;\n};',
          )
          replace_exact(
              "artifacts/legendstream-xplayer/lib/m3uCatalogHydration.ts",
              '  options: M3UDirectHydrationOptions = {},\n): Promise<M3UDirectHydration> {\n  const batchSize = Math.max(1, options.batchSize ?? M3U_HYDRATION_BATCH_SIZE);\n  const yieldFn = options.yieldFn ?? yieldToUi;',
              '  options: M3UDirectHydrationOptions,\n): Promise<M3UDirectHydration> {\n  const batchSize = Math.max(1, options.batchSize ?? M3U_HYDRATION_BATCH_SIZE);\n  const yieldFn = options.yieldFn;',
          )
          replace_exact(
              "artifacts/legendstream-xplayer/lib/m3uCatalogCache.ts",
              'import { safeLog } from "./safeLog";\n',
              'import { safeLog } from "./safeLog";\nimport { yieldToUi } from "./cooperative";\n',
          )
          replace_exact(
              "artifacts/legendstream-xplayer/lib/m3uCatalogCache.ts",
              '    const direct = await buildM3UDirectHydrationCooperatively(provider, liveRows, vodRows, seriesRows);',
              '    const direct = await buildM3UDirectHydrationCooperatively(\n      provider,\n      liveRows,\n      vodRows,\n      seriesRows,\n      { yieldFn: yieldToUi },\n    );',
          )
          PY
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm .github/workflows/apply-m3u-hydration-test-seam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/legendstream-xplayer/lib/m3uCatalogHydration.ts \
                  artifacts/legendstream-xplayer/lib/m3uCatalogCache.ts \
                  .github/workflows/apply-m3u-hydration-test-seam.yml
          git commit -m "fix: inject UI yield into M3U hydration"
          git push origin HEAD:fix/m3u-hydration-yield
