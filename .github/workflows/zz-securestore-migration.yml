name: Apply SecureStore credential migration

on:
  push:
    branches:
      - security/securestore-credentials-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/securestore-credentials-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install SecureStore
        working-directory: artifacts/legendstream-xplayer
        run: pnpm exec expo install expo-secure-store
      - name: Add secure credential layer and migrate PlayerContext
        shell: bash
        run: |
          cat > artifacts/legendstream-xplayer/lib/secureCredentials.ts <<'EOF'
          import * as SecureStore from "expo-secure-store";

          export type ProviderSecrets = {
            url?: string;
            playlistUrl?: string;
            epgUrl?: string;
            username?: string;
            password?: string;
            mac?: string;
          };

          const KEY_PREFIX = "credentials:";

          const keyFor = (providerId: string) => `${KEY_PREFIX}${providerId}`;

          function compactSecrets(secrets: ProviderSecrets): ProviderSecrets {
            const compact: ProviderSecrets = {};
            for (const [key, value] of Object.entries(secrets) as Array<[
              keyof ProviderSecrets,
              string | undefined,
            ]>) {
              if (typeof value === "string" && value.length > 0) compact[key] = value;
            }
            return compact;
          }

          export async function saveCredentials(
            providerId: string,
            secrets: ProviderSecrets,
          ): Promise<void> {
            if (!providerId) throw new Error("A provider id is required for secure credential storage.");
            await SecureStore.setItemAsync(
              keyFor(providerId),
              JSON.stringify(compactSecrets(secrets)),
            );
          }

          export async function getCredentials(
            providerId: string,
          ): Promise<ProviderSecrets | null> {
            if (!providerId) return null;
            const raw = await SecureStore.getItemAsync(keyFor(providerId));
            if (!raw) return null;
            try {
              const parsed = JSON.parse(raw) as ProviderSecrets;
              return compactSecrets(parsed);
            } catch {
              return null;
            }
          }

          export async function deleteCredentials(providerId: string): Promise<void> {
            if (!providerId) return;
            await SecureStore.deleteItemAsync(keyFor(providerId));
          }
          EOF

          python - <<'PY'
          import json
          from pathlib import Path

          # Add config plugin so Android backup rules are generated for SecureStore.
          app = Path('artifacts/legendstream-xplayer/app.json')
          data = json.loads(app.read_text())
          plugins = data['expo'].setdefault('plugins', [])
          if 'expo-secure-store' not in plugins:
              plugins.append('expo-secure-store')
          app.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          p = Path('artifacts/legendstream-xplayer/context/PlayerContext.tsx')
          s = p.read_text()

          old = 'import { mapInBatches, yieldToUi } from "@/lib/cooperative";\n'
          new = old + 'import { deleteCredentials, getCredentials, saveCredentials, type ProviderSecrets } from "@/lib/secureCredentials";\n'
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = 'const LEGACY_STORAGE_KEY = "@legendstream/player-state-v2";\nconst LOGGED_OUT = "__logged_out__";'
          new = 'const LEGACY_STORAGE_KEY = "@legendstream/player-state-v2";\nconst SECURE_MIGRATION_KEY = "@legendstream/secure-credentials-v1";\nconst LOGGED_OUT = "__logged_out__";'
          assert s.count(old) == 1
          s = s.replace(old, new)

          marker = '''const sameAccount = (a: ProviderConfig, b: Provider) =>\n  normalizeUrl(a.url || a.playlistUrl) === normalizeUrl(b.url) &&\n  (a.username || "") === (b.username || "") &&\n  (a.mac || "").toLowerCase() === (b.mac || "").toLowerCase();\n\n'''
          assert s.count(marker) == 1
          helper = r'''type StoredProviderConfig = Omit<
  ProviderConfig,
  "url" | "playlistUrl" | "epgUrl" | "username" | "password" | "mac"
>;

function providerSecretsFrom(provider: Partial<ProviderConfig>): ProviderSecrets {
  return {
    url: typeof provider.url === "string" ? provider.url : undefined,
    playlistUrl: typeof provider.playlistUrl === "string" ? provider.playlistUrl : undefined,
    epgUrl: typeof provider.epgUrl === "string" ? provider.epgUrl : undefined,
    username: typeof provider.username === "string" ? provider.username : undefined,
    password: typeof provider.password === "string" ? provider.password : undefined,
    mac: typeof provider.mac === "string" ? provider.mac : undefined,
  };
}

function hasProviderSecrets(secrets: ProviderSecrets) {
  return Object.values(secrets).some((value) => typeof value === "string" && value.length > 0);
}

function storedProviderFrom(provider: ProviderConfig): StoredProviderConfig {
  const {
    url: _url,
    playlistUrl: _playlistUrl,
    epgUrl: _epgUrl,
    username: _username,
    password: _password,
    mac: _mac,
    ...metadata
  } = provider;
  return metadata;
}

function serializedPlayerState(next: PlayerState) {
  return JSON.stringify({
    providers: next.providers.map(storedProviderFrom),
    provider: next.provider ? storedProviderFrom(next.provider) : null,
    activeProviderId: next.activeProviderId,
    favorites: next.favorites.slice(0, 500),
    history: next.history.slice(0, 50),
  });
}

async function hydrateStoredProvider(
  stored: ProviderConfig | StoredProviderConfig,
  legacySecrets?: ProviderSecrets,
): Promise<ProviderConfig> {
  const secure = await getCredentials(stored.id).catch(() => null);
  const secrets = secure ?? legacySecrets ?? providerSecretsFrom(stored as ProviderConfig);
  const url = secrets.url || secrets.playlistUrl || "";
  return {
    ...stored,
    url,
    playlistUrl: secrets.playlistUrl || secrets.url || "",
    epgUrl: secrets.epgUrl,
    username: secrets.username,
    password: secrets.password,
    mac: secrets.mac,
  } as ProviderConfig;
}

async function saveProviderSecrets(provider: ProviderConfig) {
  await saveCredentials(provider.id, providerSecretsFrom(provider));
}

'''
          s = s.replace(marker, marker + helper)

          start = s.index('const readState = async (): Promise<PlayerState> => {')
          end = s.index('\nfunction decodeBase64Utf8', start)
          replacement = r'''const readState = async (): Promise<PlayerState> => {
  let raw = await AsyncStorage.getItem(STORAGE_KEY);
  if (!raw) raw = await AsyncStorage.getItem(LEGACY_STORAGE_KEY);
  if (!raw) return emptyState;

  try {
    const saved = JSON.parse(raw) as Partial<PlayerState>;
    const storedProviders = (saved.providers ?? []) as ProviderConfig[];
    let migrationSucceeded = true;
    const legacyById = new Map<string, ProviderSecrets>();

    for (const item of storedProviders) {
      const legacySecrets = providerSecretsFrom(item);
      legacyById.set(item.id, legacySecrets);
      if (!hasProviderSecrets(legacySecrets)) continue;
      try {
        await saveCredentials(item.id, legacySecrets);
      } catch {
        migrationSucceeded = false;
      }
    }

    if (saved.provider?.id) {
      const activeLegacy = providerSecretsFrom(saved.provider);
      const existing = legacyById.get(saved.provider.id) ?? {};
      const merged = { ...existing, ...activeLegacy };
      legacyById.set(saved.provider.id, merged);
      if (hasProviderSecrets(activeLegacy)) {
        try {
          await saveCredentials(saved.provider.id, merged);
        } catch {
          migrationSucceeded = false;
        }
      }
    }

    const providers = await Promise.all(
      storedProviders.map((item) => hydrateStoredProvider(item, legacyById.get(item.id))),
    );
    const activeProviderId = saved.activeProviderId;
    const provider =
      activeProviderId === LOGGED_OUT
        ? null
        : providers.find((item) => item.id === activeProviderId) ??
          (saved.provider
            ? providers.find((item) => item.id === saved.provider?.id) ?? null
            : providers[0] ?? null);
    const next: PlayerState = {
      providers,
      provider,
      channels: [],
      epg: [],
      favorites: Array.isArray(saved.favorites) ? saved.favorites.slice(0, 500) : [],
      history: Array.isArray(saved.history) ? saved.history.slice(0, 50) : [],
      activeProviderId: activeProviderId ?? provider?.id,
    };

    if (migrationSucceeded) {
      try {
        await AsyncStorage.setItem(STORAGE_KEY, serializedPlayerState(next));
        await AsyncStorage.setItem(SECURE_MIGRATION_KEY, "1");
        await AsyncStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch {
        // SecureStore already owns the secrets. A later persist will retry metadata cleanup.
      }
    }
    return next;
  } catch {
    return emptyState;
  }
};
'''
          s = s[:start] + replacement + s[end:]

          old = '''      await AsyncStorage.setItem(\n        STORAGE_KEY,\n        JSON.stringify({\n          providers: next.providers,\n          provider: next.provider,\n          activeProviderId: next.activeProviderId,\n          favorites: next.favorites.slice(0, 500),\n          history: next.history.slice(0, 50),\n        }),\n      );'''
          new = '''      await AsyncStorage.setItem(STORAGE_KEY, serializedPlayerState(next));\n      await AsyncStorage.setItem(SECURE_MIGRATION_KEY, "1");\n      await AsyncStorage.removeItem(LEGACY_STORAGE_KEY);'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = '''      const providers = duplicate\n        ? current.providers.map((item) =>\n            item.id === duplicate.id ? savedProvider : item,\n          )\n        : [...current.providers, savedProvider];'''
          new = '''      await saveProviderSecrets(savedProvider);\n      const providers = duplicate\n        ? current.providers.map((item) =>\n            item.id === duplicate.id ? savedProvider : item,\n          )\n        : [...current.providers, savedProvider];'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = '''      epgCacheRef.current.delete(providerId);\n      await persist({\n        ...stateRef.current,\n        provider:\n          stateRef.current.provider?.id === providerId\n            ? updated'''
          new = '''      await saveProviderSecrets(updated);\n      epgCacheRef.current.delete(providerId);\n      await persist({\n        ...stateRef.current,\n        provider:\n          stateRef.current.provider?.id === providerId\n            ? updated'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = '''      epgCacheRef.current.delete(providerId);\n      await persist({\n        ...stateRef.current,\n        provider: updated,\n        activeProviderId: providerId,'''
          new = '''      await saveProviderSecrets(updated);\n      epgCacheRef.current.delete(providerId);\n      await persist({\n        ...stateRef.current,\n        provider: updated,\n        activeProviderId: providerId,'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          old = '''    await persist({\n      ...current,\n      providers,\n      provider: nextProvider,\n      activeProviderId:\n        nextProvider?.id ?? (providers.length ? providers[0].id : LOGGED_OUT),\n      channels,\n      favorites: current.favorites.filter((id) => channelIds.has(id)),\n      history: current.history.filter((id) => channelIds.has(id)),\n      epg: current.epg.filter((program) => channelIds.has(program.channelId)),\n    });\n  };'''
          new = '''    await persist({\n      ...current,\n      providers,\n      provider: nextProvider,\n      activeProviderId:\n        nextProvider?.id ?? (providers.length ? providers[0].id : LOGGED_OUT),\n      channels,\n      favorites: current.favorites.filter((id) => channelIds.has(id)),\n      history: current.history.filter((id) => channelIds.has(id)),\n      epg: current.epg.filter((program) => channelIds.has(program.channelId)),\n    });\n    await deleteCredentials(providerId).catch(() => undefined);\n  };'''
          assert s.count(old) == 1
          s = s.replace(old, new)

          p.write_text(s)

          # The catalog fallback may still patch provider type in AsyncStorage, but it must never
          # read/write username/password fields there after this migration.
          v = Path('artifacts/legendstream-xplayer/components/OptimizedHomeScreenV6.tsx')
          x = v.read_text()
          x = x.replace('''        ? {\n            ...item,\n            type: "m3u",\n            username: undefined,\n            password: undefined,\n            loadError: undefined,\n          }''', '''        ? {\n            ...item,\n            type: "m3u",\n            loadError: undefined,\n          }''')
          v.write_text(x)
          PY
      - name: Verify no credential logging
        shell: bash
        run: |
          if grep -RniE 'console\.(log|debug|info|warn|error).*\b(password|username|mac)\b|logger\.(info|debug|warn|error).*\b(password|username|mac)\b' artifacts/legendstream-xplayer --exclude-dir=node_modules; then
            echo 'Potential credential logging found' >&2
            exit 1
          fi
      - name: Typecheck mobile
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --dir artifacts/legendstream-xplayer typecheck
      - name: Commit secure storage migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-securestore-migration.yml
          git add artifacts/legendstream-xplayer pnpm-lock.yaml
          git commit -m "security(mobile): move provider secrets to SecureStore"
          git push origin HEAD:security/securestore-credentials-v2
