name: Apply M3U routing verification patch

on:
  push:
    branches:
      - fix/m3u-routing-verification
    paths:
      - .github/workflows/apply-m3u-routing-verification.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3u-routing-verification
      - name: Apply exact production patch
        run: python scripts/apply_m3u_routing_verification.py
      - name: Validate patch
        run: |
          git diff --check
          git status --short
      - name: Commit and self-clean
        run: |
          rm scripts/apply_m3u_routing_verification.py
          rm .github/workflows/apply-m3u-routing-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/legendstream-xplayer scripts/apply_m3u_routing_verification.py .github/workflows/apply-m3u-routing-verification.yml
          git commit -m "fix: resolve saved M3U routing and yield post-paint work"
          git push origin HEAD:fix/m3u-routing-verification
