name: Apply Cooperative Hydration Assertion Update

on:
  push:
    branches:
      - fix/m3u-hydration-yield
    paths:
      - .github/workflows/apply-provider-switch-hydration-assertion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3u-hydration-yield
      - name: Replace stale hydration assertion exactly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("artifacts/legendstream-xplayer/tests/providerSwitchScenarios.ts")
          text = path.read_text()
          old = '    assert.match(m3uCacheSource, /buildM3UDirectHydration\\(provider, liveRows, vodRows, seriesRows\\)/);'
          new = '''    assert.match(\n      m3uCacheSource,\n      /const direct = await buildM3UDirectHydrationCooperatively\\(\\s*provider,\\s*liveRows,\\s*vodRows,\\s*seriesRows,\\s*\\{\\s*yieldFn:\\s*yieldToUi\\s*\\},\\s*\\);/s,\n    );'''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale hydration assertion, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and push
        shell: bash
        run: |
          rm .github/workflows/apply-provider-switch-hydration-assertion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/legendstream-xplayer/tests/providerSwitchScenarios.ts \
                  .github/workflows/apply-provider-switch-hydration-assertion.yml
          git commit -m "test: require cooperative M3U cache hydration"
          git push origin HEAD:fix/m3u-hydration-yield
