name: Player UX Source Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/player-adaptive-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Apply player UX source migration
        run: |
          python3 artifacts/legendstream-xplayer/scripts/apply-player-ux.py
          python3 artifacts/legendstream-xplayer/scripts/fix-player-chrome-migration.py
      - name: Enforce source-aspect FIT behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('artifacts/legendstream-xplayer')
          compatibility = root / 'components' / 'CompatibilityVideoPlayerV2.tsx'
          surface = root / 'components' / 'player' / 'VlcPlaybackSurface.tsx'

          text = compatibility.read_text(encoding='utf-8')
          old = '  const [fit, setFit] = useState<PlayerFitMode>("full");'
          new = '  const [fit, setFit] = useState<PlayerFitMode>("fit");'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Player fit state default anchor not found')
          compatibility.write_text(text, encoding='utf-8')

          text = surface.read_text(encoding='utf-8')
          old = '    fit,\n    codecMode,'
          new = '    fit = "fit",\n    codecMode,'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('VLC fit prop default anchor not found')

          required = [
              'autoAspectRatio={false}',
              'setSourceVideoSize',
              'containedFrame(',
              'player.changeVideoAspectRatio?.(nativeAspectRatio)',
          ]
          for anchor in required:
              if anchor not in text:
                  raise SystemExit(f'Source-aspect FIT anchor missing: {anchor}')
          if 'resizeMode="contain"' in text:
              raise SystemExit('Unsupported Android resizeMode must not be used as FIT enforcement')
          surface.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated source edits
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/legendstream-xplayer
            git commit -m "fix(player): keep source-aspect FIT behavior"
            git push origin HEAD:${{ github.head_ref }}
          fi
