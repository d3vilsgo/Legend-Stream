name: Player UX Source Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/player-adaptive-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Apply player UX source migration
        run: |
          python3 artifacts/legendstream-xplayer/scripts/apply-player-ux.py
          python3 artifacts/legendstream-xplayer/scripts/fix-player-chrome-migration.py
      - name: Commit generated source edits
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/legendstream-xplayer
            git commit -m "feat(player): adaptive fill controls and active keep-awake"
            git push origin HEAD:${{ github.head_ref }}
          fi
