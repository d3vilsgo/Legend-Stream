        run: pnpm exec prettier --check artifacts/legendstream-xplayer/components/elite/EliteShowcase.tsx artifacts/legendstream-xplayer/lib/design/eliteTokens.ts artifacts/legendstream-xplayer/lib/design/eliteShowcaseModel.ts artifacts/legendstream-xplayer/showcase/elite.web.tsx artifacts/legendstream-xplayer/scripts/build-elite-showcase.mjs artifacts/legendstream-xplayer/scripts/test-elite-showcase-browser.mjs artifacts/legendstream-xplayer/tests/eliteDesignScenarios.ts
      - name: Typecheck mobile app
        run: pnpm --filter @workspace/legendstream-xplayer typecheck
      - name: Typecheck API server and references
        run: pnpm exec tsc -b artifacts/api-server/tsconfig.json --pretty false
      - name: Typecheck complete workspace including scripts
        run: pnpm run typecheck
