name: Quality

on:
  pull_request:
    branches: [integration/legendstream-u1, feature/r19-tmdb-secure-proxy,feature/r19-tmdb-film-info,feature/r19-tmdb-enrichment-foundation,feature/r18-legend-elite-design-v1,feature/r18-native-tv-premium-ux,feature/r18-native-tv-remote-player-parity, feature/r18-native-tv-universal-apk, main, feature/r18-presentation-foundation-1b, feature/r18-premium-tablet-design-foundation, feature/r18-premium-adaptive-navigation, feature/r18-tv-preview-virtual-dpad]
  push:
    branches: [integration/legendstream-u1, feature/r19-tmdb-secure-proxy,feature/r19-tmdb-film-info,feature/r19-tmdb-enrichment-foundation,feature/r18-legend-elite-design-v1,feature/r18-native-tv-premium-ux,feature/r18-native-tv-remote-player-parity, main, feature/r18-premium-tablet-design-foundation, feature/r18-premium-adaptive-navigation, feature/r18-tv-preview-virtual-dpad, feature/r18-native-tv-universal-apk]

# Deterministic, read-only CI: dependency resolution must match pnpm-lock.yaml exactly.
# Storage security gate: 6 credential scenarios + 24 backup scenarios must all pass.
# H1 logging gate: mobile 13/13 + M3U diagnostics K4 6/6 + API 4/4 redaction scenarios must pass.
# H2 console gate: direct console.* is forbidden outside tests and __DEV__ guards.
# EPG runtime gate: paged ownership, active-channel lazy recovery, cache/dedupe/race safety, stable ID, XMLTV and UI contracts must pass.
# M3U diagnostics gate: shape/classification counters, fail-fast validation, primary/cleanup outcome and stale-cache fail-closed invariants must pass.
# M3U classification gate: structural live signals must beat group-name heuristics without changing Xtream routing.
# M3U playback ref gate: extensionless credential-path live refs, safe reconstruction, and fail-closed cleanup must pass.
# SQLite diagnostics/freshness gate: fixed K4-safe error reasons, real transaction stages, schema fingerprints, and stale measurement suppression must pass.
# Catalog DB writer gate: all mutations share one coordinator, use exclusive transactions, stable M3U VOD keys, and atomic replacement semantics.
# Catalog write candidate gate: SQL/bind parity, prepared lifecycle, adaptive rollback/retry, cancellation counts, and duplicate-key semantics must pass.
# Catalog benchmark runner gate: build-flag isolation, deterministic rotation/aggregation, correctness precedence, and session ownership must pass.
# 9.2 catalog gate: runtime catalog rows must pass explicit persisted DTO projection.
# Paged catalog parity gate: persisted paging/remediation plus uncapped, chunked live identity and >500 History/Favorites completeness must pass.
# Catalog category fallback gate: __all__ must stay out of Xtream transport and empty cache must fall back.
# Catalog availability gate: usable rows stay browsable across cancelled/error refreshes; initial blocking is cache-driven.
# Provider switch UX gate: Xtream + M3U cache handoff, fallback, tab routing, tap lock, K4 error, active marker, startup continuity, direct hydration and M3U cache-write observability must pass.
# Catalog bulk sync gate: bulk-first, bounded parallel fallback, serial compatibility, cancellation and category mapping must pass.
# Poster image resilience gate: artwork URLs normalize consistently and blank catalog names never persist.
# Player live queue gate: stable identity, cache fallback, category scope and boundaries must pass.
# PR-1B media progress gate: provider scope + single v1->v2 migration + K1/K2/K4 must pass.
# Live history gate: provider scope + per-provider quota + deterministic migration + K1/K2 must pass.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out HEAD
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_HEAD_SHA"
          echo "QUALITY_EXACT_HEAD=$actual_sha"
          echo "Quality exact HEAD: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile remains unchanged
        shell: bash
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Credential storage invariants (6/6 required)
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm --filter @workspace/legendstream-xplayer test:credentials 2>&1 | tee /dev/stderr)"
          grep -F 'credential storage scenarios: 6/6 passed' <<<"$output"
      - name: Provider backup invariants (24/24 required)
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm --filter @workspace/legendstream-xplayer test:backup 2>&1 | tee /dev/stderr)"
          grep -F 'provider backup acceptance: 7/7 passed' <<<"$output"
          grep -F 'negative crypto: 2/2 passed' <<<"$output"
          grep -F 'credential round-trip: 1/1 passed' <<<"$output"
          grep -F 'security regressions: 14/14 passed' <<<"$output"
          grep -F 'provider backup tests: 24/24 passed' <<<"$output"
      - name: Log redaction invariants (13/13 mobile + M3U K4 6/6 + 4/4 API required)
        shell: bash
        run: |
          set -euo pipefail
          mobile="$(pnpm --filter @workspace/legendstream-xplayer test:logging 2>&1 | tee /dev/stderr)"
          grep -F 'log redaction scenarios: 13/13 passed' <<<"$mobile"
          grep -F 'm3u diagnostics K4 scenarios: 6/6 passed' <<<"$mobile"
          api="$(pnpm --filter @workspace/legendstream-xplayer exec tsx "$GITHUB_WORKSPACE/artifacts/api-server/src/lib/logRedaction.test.ts" 2>&1 | tee /dev/stderr)"
          grep -F 'API log redaction scenarios: 4/4 passed' <<<"$api"
      - name: Console usage guard (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-console-usage.mjs --self-test
          node scripts/check-console-usage.mjs
      - name: EPG runtime regressions (12/12 + UTF-8 required)
        shell: bash
        run: |
          set -euo pipefail
          epg="$(pnpm --filter @workspace/legendstream-xplayer test:epg 2>&1 | tee /dev/stderr)"
          grep -F 'epg runtime scenarios: 12/12 passed' <<<"$epg"
          grep -F 'Stalker product EPG scenarios: 20/20 passed' <<<"$epg"
          grep -F 'EPG UTF-8 regression samples passed.' <<<"$epg"
      - name: M3U shape diagnostics regressions (8/8 required)
        shell: bash
        run: |
          set -euo pipefail
          diagnostics="$(pnpm --filter @workspace/legendstream-xplayer test:m3u-diagnostics 2>&1 | tee /dev/stderr)"
          grep -F 'm3u shape diagnostics scenarios: 8/8 passed' <<<"$diagnostics"
      - name: M3U structural classification regressions (6/6 required)
        shell: bash
        run: |
          set -euo pipefail
          classification="$(pnpm --filter @workspace/legendstream-xplayer test:m3u-classification 2>&1 | tee /dev/stderr)"
          grep -F 'm3u classification scenarios: 6/6 passed' <<<"$classification"
      - name: M3U playback ref regressions (8/8 required)
        shell: bash
        run: |
          set -euo pipefail
          playback_ref="$(pnpm --filter @workspace/legendstream-xplayer test:m3u-playback-ref 2>&1 | tee /dev/stderr)"
          grep -F 'm3u playback ref scenarios: 8/8 passed' <<<"$playback_ref"
      - name: SQLite diagnostics + catalog measurement freshness (28/28 required)
        shell: bash
        run: |
          set -euo pipefail
          sqlite_diag="$(pnpm --filter @workspace/legendstream-xplayer test:sqlite-diagnostics-freshness 2>&1 | tee /dev/stderr)"
          grep -F 'sqlite diagnostics freshness scenarios: 28/28 passed' <<<"$sqlite_diag"
      - name: Catalog DB writer coordination regressions (8/8 required)
        shell: bash
        run: |
          set -euo pipefail
          writer="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-db-writer 2>&1 | tee /dev/stderr)"
          grep -F 'catalog DB writer coordination scenarios: 8/8 passed' <<<"$writer"
      - name: Catalog prepared write candidate semantics (27/27 required)
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-write-batch 2>&1 | tee /dev/stderr)"
          grep -F 'catalog write batch scenarios: 27/27 passed' <<<"$candidate"
      - name: Catalog native benchmark runner semantics (41/41 required)
        shell: bash
        run: |
          set -euo pipefail
          runner="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-write-benchmark-runner 2>&1 | tee /dev/stderr)"
          grep -F 'catalog write benchmark runner scenarios: 41/41 passed' <<<"$runner"
      - name: Catalog benchmark runtime isolation (9/9 required)
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-benchmark-runtime 2>&1 | tee /dev/stderr)"
          grep -F 'catalog benchmark runtime isolation scenarios: 9/9 passed' <<<"$runtime"
      - name: Catalog persistence invariants (10/10 required)
        shell: bash
        run: |
          set -euo pipefail
          catalog="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-persistence 2>&1 | tee /dev/stderr)"
          grep -F 'catalog persistence scenarios: 10/10 passed' <<<"$catalog"
      - name: Paged catalog parity regressions (12/12 + 4/4 + 12/12 required)
        shell: bash
        run: |
          set -euo pipefail
          parity="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-parity 2>&1 | tee /dev/stderr)"
          grep -F 'catalog parity scenarios: 12/12 passed' <<<"$parity"
          grep -F 'paged catalog remediation scenarios: 4/4 passed' <<<"$parity"
          grep -F 'history favorites resolution scenarios: 12/12 passed' <<<"$parity"
      - name: Catalog category fallback regressions (8/8 required)
        shell: bash
        run: |
          set -euo pipefail
          fallback="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-category-fallback 2>&1 | tee /dev/stderr)"
          grep -F 'catalog category fallback scenarios: 8/8 passed' <<<"$fallback"
      - name: Catalog cache availability regressions (7/7 required)
        shell: bash
        run: |
          set -euo pipefail
          availability="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-availability 2>&1 | tee /dev/stderr)"
          grep -F 'catalog availability scenarios: 7/7 passed' <<<"$availability"
      - name: Provider switch UX regressions (24/24 required)
        shell: bash
        run: |
          set -euo pipefail
          provider_switch="$(pnpm --filter @workspace/legendstream-xplayer test:provider-switch 2>&1 | tee /dev/stderr)"
          grep -F 'provider switch UX scenarios: 24/24 passed' <<<"$provider_switch"
      - name: Catalog bulk sync regressions (7/7 required)
        shell: bash
        run: |
          set -euo pipefail
          bulk="$(pnpm --filter @workspace/legendstream-xplayer test:catalog-bulk-sync 2>&1 | tee /dev/stderr)"
          grep -F 'catalog bulk sync scenarios: 7/7 passed' <<<"$bulk"
      - name: Poster image resilience regressions (6/6 required)
        shell: bash
        run: |
          set -euo pipefail
          poster="$(pnpm --filter @workspace/legendstream-xplayer test:poster-image-resilience 2>&1 | tee /dev/stderr)"
          grep -F 'poster image resilience scenarios: 6/6 passed' <<<"$poster"
      - name: Player live queue regressions (6/6 required)
        shell: bash
        run: |
          set -euo pipefail
          player="$(pnpm --filter @workspace/legendstream-xplayer test:player-live-queue 2>&1 | tee /dev/stderr)"
          grep -F 'player live queue scenarios: 6/6 passed' <<<"$player"
      - name: Media progress provider-scope and migration invariants (31/31 required)
        shell: bash
        run: |
          set -euo pipefail
          progress="$(pnpm --filter @workspace/legendstream-xplayer test:media-progress 2>&1 | tee /dev/stderr)"
          grep -F 'media progress scenarios: 31/31 passed' <<<"$progress"
      - name: Live history provider-scope and migration invariants (32/32 required)
        shell: bash
        run: |
          set -euo pipefail
          history="$(pnpm --filter @workspace/legendstream-xplayer test:live-history 2>&1 | tee /dev/stderr)"
          grep -F 'live history scenarios: 32/32 passed' <<<"$history"
          grep -F 'live history owner scenarios: 9/9 passed' <<<"$history"
      - name: Adaptive UI presentation foundation (23/23 required)
        shell: bash
        run: |
          set -euo pipefail
          ui="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/uiPresentationScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'ui presentation scenarios: 23/23 passed' <<<"$ui"
      - name: R18-C unified product shell contract
        shell: bash
        run: |
          set -euo pipefail
          shell_contract="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/r18CProductShellScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'R18-C product shell scenarios passed.' <<<"$shell_contract"
      - name: R18-C2 credential-safe Stalker trace
        shell: bash
        run: |
          set -euo pipefail
          trace="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/r18C2StalkerTraceScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'R18-C2 credential-safe trace scenarios passed.' <<<"$trace"
      - name: Repository hygiene guard
        shell: bash
        run: |
          set -euo pipefail
          if [ -d artifacts/mockup-sandbox ]; then
            echo 'artifacts/mockup-sandbox still exists'
            exit 1
          fi
          echo 'Repository hygiene guard passed.'
      - name: Device presentation foundation scenarios
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/legendstream-xplayer exec tsx tests/devicePresentationScenarios.ts
      - name: Presentation orientation lifecycle (14/14 required)
        shell: bash
        run: |
          set -euo pipefail
          lifecycle="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/presentationLifecycleScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'presentation lifecycle scenarios: 14/14 passed' <<<"$lifecycle"
      - name: Premium design system scenarios
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/designSystemScenarios.ts
      - name: Premium catalog grid layout scenarios
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/catalogGridLayoutScenarios.ts
      - name: Startup and playback performance diagnostics
        run: pnpm --filter @workspace/legendstream-xplayer exec node --import tsx tests/performanceDiagnosticsScenarios.ts
      - name: U3 source formatting
        run: pnpm exec prettier --check artifacts/legendstream-xplayer/lib/performanceDiagnostics.ts artifacts/legendstream-xplayer/lib/catalogRefreshPolicy.ts artifacts/legendstream-xplayer/lib/catalogRefreshWindow.ts artifacts/legendstream-xplayer/components/CatalogRefreshSettings.tsx artifacts/legendstream-xplayer/tests/u3PerformanceScenarios.ts artifacts/legendstream-xplayer/tests/u3CatalogCoordinatorScenarios.mjs artifacts/legendstream-xplayer/tests/u3RefreshWindowScenarios.ts artifacts/legendstream-xplayer/tests/u3CatalogSqliteScenarios.mjs
      - name: Cache-first catalog refresh policy
        run: pnpm --filter @workspace/legendstream-xplayer exec node --import tsx tests/catalogRefreshPolicyScenarios.ts
      - name: U3 production cache coordinator
        run: node artifacts/legendstream-xplayer/tests/u3CatalogCoordinatorScenarios.mjs
      - name: U3 cached window retention
        run: pnpm --filter @workspace/legendstream-xplayer exec node --import tsx tests/u3RefreshWindowScenarios.ts
      - name: U3 production SQLite cache rollback and legacy records
        run: node artifacts/legendstream-xplayer/tests/u3CatalogSqliteScenarios.mjs
      - name: U3 performance lifecycle privacy and bounds
        run: pnpm --filter @workspace/legendstream-xplayer exec node --import tsx tests/u3PerformanceScenarios.ts
      - name: U2 cross-device geometry and Preview restoration
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/u2ResponsiveScenarios.ts
      - name: U2 production responsive catalog hook
        run: node artifacts/legendstream-xplayer/tests/u2CatalogHookScenarios.mjs
      - name: Premium Home hero scenarios
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/premiumHomeHeroScenarios.ts
      - name: Premium tablet design foundation scenarios (11/11 required)
        shell: bash
        run: |
          set -euo pipefail
          result="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/tabletDesignFoundationScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'premium tablet design foundation scenarios: 11/11 passed' <<<"$result"
      - name: Premium adaptive navigation scenarios (16/16 required)
        shell: bash
        run: |
          set -euo pipefail
          result="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/adaptiveNavigationScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'premium adaptive navigation scenarios: 16/16 passed' <<<"$result"
      - name: TV Preview and virtual D-pad interaction scenarios (32/32 required)
        shell: bash
        run: |
          set -euo pipefail
          result="$(pnpm --filter @workspace/legendstream-xplayer exec tsx tests/tvPreviewScenarios.ts 2>&1 | tee /dev/stderr)"
          grep -F 'TV Preview interaction scenarios: 32/32 passed' <<<"$result"
      - name: Native Android TV and universal APK contract
        run: node artifacts/legendstream-xplayer/tests/androidTvUniversalBuildScenarios.mjs
      - name: Production Android focus policy JVM behavior
        run: node artifacts/legendstream-xplayer/tests/nativeTvFocusJvmScenarios.mjs
      - name: Native TV Home compact geometry
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/nativeTvHomeLayoutScenarios.ts
      - name: Native TV Home production component render contract
        run: node artifacts/legendstream-xplayer/tests/nativeTvHomeRenderScenarios.mjs
      - name: Native TV Home helper and test formatting
        run: pnpm exec prettier --check artifacts/legendstream-xplayer/lib/design/nativeTvHomeLayout.ts artifacts/legendstream-xplayer/tests/nativeTvHomeLayoutScenarios.ts artifacts/legendstream-xplayer/tests/nativeTvHomeRenderScenarios.mjs
      - name: Native TV bounded persistence on exit
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/nativeTvExitScenarios.ts
      - name: TV remote inspector behavioral privacy and event separation
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/tvRemoteInspectorScenarios.ts
      - name: Native TV remote ownership and action semantics
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/nativeTvRemoteScenarios.ts
      - name: Native TV responsive dp matrix
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/nativeTvResponsiveScenarios.ts
      - name: TMDB metadata matching cache and identity foundation
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/tmdbFoundationScenarios.ts
      - name: U4 Home Film Info provider ownership and action parity
        run: node artifacts/legendstream-xplayer/tests/u4HomeMovieInfoScenarios.mjs
      - name: U4 Home Film Info hook and test formatting
        run: pnpm exec prettier --check artifacts/legendstream-xplayer/hooks/useHomeMovieInfo.ts artifacts/legendstream-xplayer/tests/u4HomeMovieInfoScenarios.mjs
      - name: TMDB Film Info mock behavior and access policy
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/tmdbMovieInfoScenarios.ts
      - name: TMDB secure proxy behavior (mock upstream, no live claim)
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/tmdbSecureProxyScenarios.ts
      - name: TMDB proxy HTTP boundary and timeout behavior
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx "$GITHUB_WORKSPACE/artifacts/api-server/src/lib/tmdb/proxyHttp.test.ts"
      - name: TMDB secure proxy formatting
        run: pnpm exec prettier --check artifacts/api-server/src/lib/tmdb artifacts/api-server/src/routes/tmdb.ts artifacts/legendstream-xplayer/lib/tmdbProxy artifacts/legendstream-xplayer/tests/tmdbSecureProxyScenarios.ts
      - name: TMDB Film Info source formatting
        run: pnpm exec prettier --check artifacts/legendstream-xplayer/components/tmdb artifacts/legendstream-xplayer/tests/tmdbMovieInfoScenarios.ts
      - name: TMDB foundation formatting
        run: pnpm exec prettier --check artifacts/legendstream-xplayer/lib/tmdb artifacts/legendstream-xplayer/tests/tmdbFoundationScenarios.ts
      - name: Elite V2 Live responsive layout and selection
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/eliteLiveLayoutScenarios.ts
      - name: Elite design state, geometry, alpha contrast and isolation
        run: pnpm --filter @workspace/legendstream-xplayer exec tsx tests/eliteDesignScenarios.ts
      - name: Elite showcase build (same React Native components)
        run: node artifacts/legendstream-xplayer/scripts/build-elite-showcase.mjs /tmp/legend-elite-preview
