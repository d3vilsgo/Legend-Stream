name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Deterministic, read-only CI: dependency resolution must match pnpm-lock.yaml exactly.
# Storage security gate: 6 credential scenarios + 24 backup scenarios must all pass.
# H1 logging gate: mobile 8/8 + API 4/4 redaction scenarios must pass.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile remains unchanged
        shell: bash
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Credential storage invariants (6/6 required)
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm --filter @workspace/legendstream-xplayer test:credentials 2>&1 | tee /dev/stderr)"
          grep -F 'credential storage scenarios: 6/6 passed' <<<"$output"
      - name: Provider backup invariants (24/24 required)
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm --filter @workspace/legendstream-xplayer test:backup 2>&1 | tee /dev/stderr)"
          grep -F 'provider backup acceptance: 7/7 passed' <<<"$output"
          grep -F 'negative crypto: 2/2 passed' <<<"$output"
          grep -F 'credential round-trip: 1/1 passed' <<<"$output"
          grep -F 'security regressions: 14/14 passed' <<<"$output"
          grep -F 'provider backup tests: 24/24 passed' <<<"$output"
      - name: Log redaction invariants (8/8 mobile + 4/4 API required)
        shell: bash
        run: |
          set -euo pipefail
          mobile="$(pnpm --filter @workspace/legendstream-xplayer test:logging 2>&1 | tee /dev/stderr)"
          grep -F 'log redaction scenarios: 8/8 passed' <<<"$mobile"
          api="$(pnpm --filter @workspace/legendstream-xplayer exec tsx "$GITHUB_WORKSPACE/artifacts/api-server/src/lib/logRedaction.test.ts" 2>&1 | tee /dev/stderr)"
          grep -F 'API log redaction scenarios: 4/4 passed' <<<"$api"
      - name: Verify Replit removal
        shell: bash
        run: |
          set -euo pipefail
          if find . -path './.git' -prune -o \( -name '.replit' -o -name '.replitignore' -o -name '.replit-artifact' -o -name 'replit.md' \) -print | grep -q .; then
            echo 'Replit metadata still present:'
            find . -path './.git' -prune -o \( -name '.replit' -o -name '.replitignore' -o -name '.replit-artifact' -o -name 'replit.md' \) -print
            exit 1
          fi
          if [ -d artifacts/mockup-sandbox ]; then
            echo 'artifacts/mockup-sandbox still exists'
            exit 1
          fi
          active_matches="$(grep -RInE --exclude='pnpm-lock.yaml' --exclude='*.md' --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='.github' '(@replit/|stripe-replit-sync|REPLIT_|REPL_ID)' package.json pnpm-workspace.yaml artifacts lib scripts 2>/dev/null || true)"
          if [ -n "$active_matches" ]; then
            echo 'Active Replit references still present:'
            echo "$active_matches"
            exit 1
          fi
          if grep -Ein '(@replit/|stripe-replit-sync)' pnpm-lock.yaml; then
            echo 'Replit packages remain in pnpm-lock.yaml'
            exit 1
          fi
          echo 'Replit cleanup verification passed.'
      - name: Typecheck mobile app
        run: pnpm --filter @workspace/legendstream-xplayer typecheck
      - name: Typecheck API server and references
        run: pnpm exec tsc -b artifacts/api-server/tsconfig.json --pretty false
