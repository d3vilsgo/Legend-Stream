name: Apply api-server SSRF hardening

on:
  push:
    branches:
      - security/api-ssrf-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/api-ssrf-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Apply source patch
        run: python scripts/tmp_api_ssrf_patch.py
      - name: Typecheck api-server
        run: pnpm --dir artifacts/api-server typecheck
      - name: Build api-server
        run: pnpm --dir artifacts/api-server build
      - name: SSRF and HTTP boundary smoke tests
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 NODE_ENV=production node artifacts/api-server/dist/index.mjs > /tmp/legend-api.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:43127/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          check_blocked() {
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' -d "{\"baseUrl\":\"$1\",\"username\":\"u\",\"password\":\"p\"}" http://127.0.0.1:43127/api/iptv/xtream)
            test "$code" = "403"
            grep -q 'BLOCKED_UPSTREAM_ADDRESS' /tmp/body
          }
          check_blocked 'http://localhost'
          check_blocked 'http://127.0.0.1'
          check_blocked 'http://169.254.169.254'
          check_blocked 'http://192.168.1.1'
          check_blocked 'http://10.0.0.1'

          code=$(curl -sS -o /tmp/public-body -w '%{http_code}' -H 'Content-Type: application/json' -d '{"baseUrl":"https://example.com","username":"u","password":"p"}' http://127.0.0.1:43127/api/iptv/xtream)
          if grep -q 'BLOCKED_UPSTREAM_ADDRESS' /tmp/public-body; then
            echo 'Public host was incorrectly blocked' >&2
            exit 1
          fi

          code=$(curl -sS -o /tmp/cors-body -w '%{http_code}' -H 'Origin: https://evil.example' http://127.0.0.1:43127/api/health)
          test "$code" = "403"

          python -c 'import json; print(json.dumps({"baseUrl":"https://example.com","username":"u","password":"x"*40000}))' > /tmp/large.json
          code=$(curl -sS -o /tmp/large-body -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/large.json http://127.0.0.1:43127/api/iptv/xtream)
          test "$code" = "413"

          for i in $(seq 1 60); do
            curl -sS -o /dev/null -H 'Content-Type: application/json' -d '{"baseUrl":"http://127.0.0.1","username":"u","password":"p"}' http://127.0.0.1:43127/api/iptv/xtream || true
          done
          code=$(curl -sS -o /tmp/rate-body -w '%{http_code}' -H 'Content-Type: application/json' -d '{"baseUrl":"http://127.0.0.1","username":"u","password":"p"}' http://127.0.0.1:43127/api/iptv/xtream)
          test "$code" = "429"
          grep -q 'RATE_LIMITED' /tmp/rate-body
      - name: Commit api-server hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-api-ssrf-hardening.yml scripts/tmp_api_ssrf_patch.py
          git add artifacts/api-server pnpm-lock.yaml
          git commit -m "security(api): block SSRF and harden Xtream proxy"
          git push origin HEAD:security/api-ssrf-hardening
