name: Apply api-server SSRF hardening

on:
  push:
    branches:
      - security/api-ssrf-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/api-ssrf-hardening
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Add pinned-DNS network policy and rate limiting
        shell: bash
        run: |
          cat > artifacts/api-server/src/lib/safeHttp.ts <<'EOF'
          import { lookup } from "node:dns/promises";
          import { request as httpRequest } from "node:http";
          import { request as httpsRequest } from "node:https";
          import { isIP } from "node:net";

          export class SafeHttpError extends Error {
            constructor(
              message: string,
              public readonly code: "SSRF_BLOCKED" | "DNS_FAILED" | "TIMEOUT" | "UNREACHABLE" | "TOO_MANY_REDIRECTS" | "RESPONSE_TOO_LARGE",
            ) {
              super(message);
              this.name = "SafeHttpError";
            }
          }

          type PinnedAddress = { address: string; family: 4 | 6 };
          type SafeResponse = { status: number; text: string };

          const MAX_REDIRECTS = 4;
          const MAX_RESPONSE_BYTES = 64 * 1024 * 1024;

          function ipv4Number(address: string) {
            const parts = address.split(".").map(Number);
            if (parts.length !== 4 || parts.some((part) => !Number.isInteger(part) || part < 0 || part > 255)) return null;
            return (((parts[0] * 256 + parts[1]) * 256 + parts[2]) * 256 + parts[3]) >>> 0;
          }

          function inV4Cidr(address: string, network: string, prefix: number) {
            const ip = ipv4Number(address);
            const base = ipv4Number(network);
            if (ip === null || base === null) return false;
            const mask = prefix === 0 ? 0 : (0xffffffff << (32 - prefix)) >>> 0;
            return (ip & mask) === (base & mask);
          }

          const blockedV4: Array<[string, number]> = [
            ["0.0.0.0", 8],
            ["10.0.0.0", 8],
            ["100.64.0.0", 10],
            ["127.0.0.0", 8],
            ["169.254.0.0", 16],
            ["172.16.0.0", 12],
            ["192.0.0.0", 24],
            ["192.0.2.0", 24],
            ["192.168.0.0", 16],
            ["198.18.0.0", 15],
            ["198.51.100.0", 24],
            ["203.0.113.0", 24],
            ["224.0.0.0", 4],
            ["240.0.0.0", 4],
          ];

          function normalizeIpv6(address: string) {
            return address.toLowerCase().split("%")[0];
          }

          function blockedIpv6(address: string) {
            const value = normalizeIpv6(address);
            if (value === "::" || value === "::1") return true;
            const mapped = value.match(/^::ffff:(\d+\.\d+\.\d+\.\d+)$/);
            if (mapped) return isBlockedAddress(mapped[1]);
            const first = value.split(":")[0] || "0";
            const firstValue = Number.parseInt(first, 16);
            if (!Number.isFinite(firstValue)) return true;
            // fc00::/7 unique-local, fe80::/10 link-local, ff00::/8 multicast.
            if ((firstValue & 0xfe00) === 0xfc00) return true;
            if ((firstValue & 0xffc0) === 0xfe80) return true;
            if ((firstValue & 0xff00) === 0xff00) return true;
            // Documentation and discard-only ranges must never be proxy targets.
            if (value.startsWith("2001:db8:")) return true;
            if (value.startsWith("100::") || value.startsWith("100:0:0:1")) return true;
            return false;
          }

          export function isBlockedAddress(address: string) {
            const family = isIP(address);
            if (family === 4) return blockedV4.some(([network, prefix]) => inV4Cidr(address, network, prefix));
            if (family === 6) return blockedIpv6(address);
            return true;
          }

          export async function resolvePublicHost(hostname: string): Promise<PinnedAddress> {
            const normalized = hostname.trim().toLowerCase().replace(/\.$/, "");
            if (!normalized || normalized === "localhost" || normalized.endsWith(".localhost")) {
              throw new SafeHttpError("Local/private provider addresses are not allowed.", "SSRF_BLOCKED");
            }

            const literalFamily = isIP(normalized);
            if (literalFamily) {
              if (isBlockedAddress(normalized)) {
                throw new SafeHttpError("Local/private provider addresses are not allowed.", "SSRF_BLOCKED");
              }
              return { address: normalized, family: literalFamily as 4 | 6 };
            }

            let addresses: Array<{ address: string; family: number }>;
            try {
              addresses = await lookup(normalized, { all: true, verbatim: true });
            } catch {
              throw new SafeHttpError("The provider hostname could not be resolved.", "DNS_FAILED");
            }
            if (!addresses.length) {
              throw new SafeHttpError("The provider hostname could not be resolved.", "DNS_FAILED");
            }
            // Reject mixed public/private answers instead of selecting the convenient public one.
            if (addresses.some((entry) => isBlockedAddress(entry.address))) {
              throw new SafeHttpError("The provider hostname resolves to a local/private address.", "SSRF_BLOCKED");
            }
            const selected = addresses.find((entry) => entry.family === 4 || entry.family === 6);
            if (!selected) throw new SafeHttpError("The provider hostname could not be resolved.", "DNS_FAILED");
            return { address: selected.address, family: selected.family as 4 | 6 };
          }

          function requestPinned(
            url: URL,
            pinned: PinnedAddress,
            headers: Record<string, string>,
            timeoutMs: number,
          ): Promise<SafeResponse & { location?: string }> {
            return new Promise((resolve, reject) => {
              const request = url.protocol === "https:" ? httpsRequest : httpRequest;
              const req = request(
                url,
                {
                  method: "GET",
                  headers,
                  lookup: (_hostname, _options, callback) => {
                    callback(null, pinned.address, pinned.family);
                  },
                },
                (res) => {
                  const chunks: Buffer[] = [];
                  let total = 0;
                  res.on("data", (chunk: Buffer | string) => {
                    const data = Buffer.isBuffer(chunk) ? chunk : Buffer.from(chunk);
                    total += data.length;
                    if (total > MAX_RESPONSE_BYTES) {
                      req.destroy(new SafeHttpError("The provider response is too large.", "RESPONSE_TOO_LARGE"));
                      return;
                    }
                    chunks.push(data);
                  });
                  res.on("end", () => {
                    resolve({
                      status: res.statusCode ?? 502,
                      text: Buffer.concat(chunks).toString("utf8"),
                      location: typeof res.headers.location === "string" ? res.headers.location : undefined,
                    });
                  });
                },
              );
              req.setTimeout(timeoutMs, () => {
                req.destroy(new SafeHttpError("The provider request timed out.", "TIMEOUT"));
              });
              req.on("error", (error) => {
                if (error instanceof SafeHttpError) reject(error);
                else reject(new SafeHttpError("The provider could not be reached.", "UNREACHABLE"));
              });
              req.end();
            });
          }

          export async function safeGetText(
            input: URL,
            headers: Record<string, string>,
            timeoutMs = 20_000,
            redirectsLeft = MAX_REDIRECTS,
          ): Promise<SafeResponse> {
            if (!["http:", "https:"].includes(input.protocol)) {
              throw new SafeHttpError("Only HTTP/HTTPS provider URLs are allowed.", "SSRF_BLOCKED");
            }
            const pinned = await resolvePublicHost(input.hostname);
            const response = await requestPinned(input, pinned, headers, timeoutMs);
            if ([301, 302, 303, 307, 308].includes(response.status) && response.location) {
              if (redirectsLeft <= 0) {
                throw new SafeHttpError("The provider redirected too many times.", "TOO_MANY_REDIRECTS");
              }
              const redirected = new URL(response.location, input);
              return safeGetText(redirected, headers, timeoutMs, redirectsLeft - 1);
            }
            return { status: response.status, text: response.text };
          }
          EOF

          cat > artifacts/api-server/src/middlewares/xtreamRateLimit.ts <<'EOF'
          import type { RequestHandler } from "express";

          const WINDOW_MS = 60_000;
          const MAX_REQUESTS = Math.max(10, Number(process.env.XTREAM_RATE_LIMIT_PER_MINUTE) || 60);
          const buckets = new Map<string, { startedAt: number; count: number }>();

          export const xtreamRateLimit: RequestHandler = (req, res, next) => {
            const now = Date.now();
            const key = req.ip || req.socket.remoteAddress || "unknown";
            const current = buckets.get(key);
            if (!current || now - current.startedAt >= WINDOW_MS) {
              buckets.set(key, { startedAt: now, count: 1 });
              next();
              return;
            }
            current.count += 1;
            if (current.count > MAX_REQUESTS) {
              const retryAfter = Math.max(1, Math.ceil((WINDOW_MS - (now - current.startedAt)) / 1000));
              res.setHeader("Retry-After", String(retryAfter));
              res.status(429).json({
                error: {
                  code: "RATE_LIMITED",
                  message: "Too many Xtream proxy requests. Try again shortly.",
                },
              });
              return;
            }
            if (buckets.size > 10_000) {
              for (const [bucketKey, bucket] of buckets) {
                if (now - bucket.startedAt >= WINDOW_MS) buckets.delete(bucketKey);
              }
            }
            next();
          };
          EOF

          python - <<'PY'
          from pathlib import Path

          p = Path('artifacts/api-server/src/routes/iptv.ts')
          s = p.read_text()
          s = s.replace('import { Router, type IRouter } from "express";\n', 'import { Router, type IRouter } from "express";\nimport { SafeHttpError, safeGetText } from "../lib/safeHttp";\nimport { xtreamRateLimit } from "../middlewares/xtreamRateLimit";\n')
          s = s.replace('const router: IRouter = Router();\n', 'const router: IRouter = Router();\n\nrouter.use("/xtream", xtreamRateLimit);\n')

          start = s.index('async function providerJson(')
          end = s.index('\nconst allowedActions', start)
          replacement = r'''async function providerJson(
  url: URL,
  credentials: { username: string; password: string },
) {
  url.searchParams.set("username", credentials.username);
  url.searchParams.set("password", credentials.password);
  let response: { status: number; text: string };
  try {
    response = await safeGetText(url, providerHeaders, 20_000);
  } catch (error) {
    if (error instanceof SafeHttpError && error.code === "SSRF_BLOCKED") {
      throw new UpstreamError(
        "Local, private, link-local, and reserved provider addresses are not allowed.",
        403,
        "BLOCKED_UPSTREAM_ADDRESS",
      );
    }
    if (error instanceof SafeHttpError && error.code === "TIMEOUT") {
      throw new UpstreamError(
        "The Xtream server took too long to respond.",
        504,
        "PROVIDER_TIMEOUT",
      );
    }
    throw new UpstreamError(
      "The Xtream server could not be reached. Check the URL, port, DNS, and network.",
      502,
      "PROVIDER_UNREACHABLE",
    );
  }

  let data: unknown;
  try {
    data = JSON.parse(response.text);
  } catch {
    throw new UpstreamError(
      "The Xtream server returned an invalid response instead of JSON.",
      502,
      "INVALID_PROVIDER_RESPONSE",
    );
  }
  if (response.status < 200 || response.status >= 300) {
    throw new UpstreamError(
      `The Xtream server returned HTTP ${response.status}.`,
      response.status >= 400 && response.status < 500 ? 401 : 502,
      response.status === 401 || response.status === 403
        ? "PROVIDER_AUTH_HTTP_ERROR"
        : "PROVIDER_HTTP_ERROR",
    );
  }
  return data as any;
}
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          app = Path('artifacts/api-server/src/app.ts')
          x = app.read_text()
          old = '''app.use(cors());\napp.use(express.json());\napp.use(express.urlencoded({ extended: true }));'''
          new = r'''const corsAllowlist = new Set(
  (process.env.CORS_ALLOWLIST ?? "")
    .split(",")
    .map((value) => value.trim())
    .filter(Boolean),
);

app.use((req, res, next) => {
  const origin = req.get("Origin");
  if (origin && !corsAllowlist.has(origin)) {
    res.status(403).json({
      error: { code: "CORS_ORIGIN_DENIED", message: "This web origin is not allowed." },
    });
    return;
  }
  next();
});
app.use(cors({
  origin(origin, callback) {
    callback(null, !origin || corsAllowlist.has(origin));
  },
}));
app.use(express.json({ limit: "32kb" }));
app.use(express.urlencoded({ extended: true, limit: "32kb" }));'''
          assert x.count(old) == 1
          app.write_text(x.replace(old, new))
          PY
      - name: Typecheck and build api-server
        run: |
          pnpm --dir artifacts/api-server typecheck
          pnpm --dir artifacts/api-server build
      - name: SSRF and HTTP boundary smoke tests
        shell: bash
        run: |
          set -euo pipefail
          PORT=43127 NODE_ENV=production node artifacts/api-server/dist/index.mjs > /tmp/legend-api.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:43127/api/health >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          check_blocked() {
            code=$(curl -sS -o /tmp/body -w '%{http_code}' -H 'Content-Type: application/json' \
              -d "{\"baseUrl\":\"$1\",\"username\":\"u\",\"password\":\"p\"}" \
              http://127.0.0.1:43127/api/iptv/xtream)
            test "$code" = "403"
            grep -q 'BLOCKED_UPSTREAM_ADDRESS' /tmp/body
          }
          check_blocked 'http://localhost'
          check_blocked 'http://127.0.0.1'
          check_blocked 'http://169.254.169.254'
          check_blocked 'http://192.168.1.1'
          check_blocked 'http://10.0.0.1'

          # Public DNS must pass the SSRF gate. example.com is not Xtream, so a 502 JSON parse
          # response is expected; a 403 BLOCKED_UPSTREAM_ADDRESS would be a regression.
          code=$(curl -sS -o /tmp/public-body -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"baseUrl":"https://example.com","username":"u","password":"p"}' \
            http://127.0.0.1:43127/api/iptv/xtream)
          if grep -q 'BLOCKED_UPSTREAM_ADDRESS' /tmp/public-body; then
            echo 'Public host was incorrectly blocked' >&2
            exit 1
          fi

          # CORS denylist boundary.
          code=$(curl -sS -o /tmp/cors-body -w '%{http_code}' -H 'Origin: https://evil.example' http://127.0.0.1:43127/api/health)
          test "$code" = "403"

          # Request body limit.
          python - <<'PY' >/tmp/large.json
          import json
          print(json.dumps({'baseUrl':'https://example.com','username':'u','password':'x'*40000}))
          PY
          code=$(curl -sS -o /tmp/large-body -w '%{http_code}' -H 'Content-Type: application/json' --data-binary @/tmp/large.json http://127.0.0.1:43127/api/iptv/xtream)
          test "$code" = "413"

          # Rate limit: a fresh process allows 60 requests/minute, the 61st must be 429.
          for i in $(seq 1 60); do
            curl -sS -o /dev/null -H 'Content-Type: application/json' \
              -d '{"baseUrl":"http://127.0.0.1","username":"u","password":"p"}' \
              http://127.0.0.1:43127/api/iptv/xtream || true
          done
          code=$(curl -sS -o /tmp/rate-body -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"baseUrl":"http://127.0.0.1","username":"u","password":"p"}' \
            http://127.0.0.1:43127/api/iptv/xtream)
          test "$code" = "429"
          grep -q 'RATE_LIMITED' /tmp/rate-body
      - name: Commit api-server hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-api-ssrf-hardening.yml
          git add artifacts/api-server pnpm-lock.yaml
          git commit -m "security(api): block SSRF and harden Xtream proxy"
          git push origin HEAD:security/api-ssrf-hardening
