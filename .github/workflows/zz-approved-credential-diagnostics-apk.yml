name: Approved credential diagnostics APK

on:
  push:
    branches:
      - diagnostics/securestore-readonly-apk
    paths:
      - ".github/workflows/zz-approved-credential-diagnostics-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/go || true
          docker system prune -af --volumes || true
          sudo apt-get clean || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/legendstream-xplayer... install --no-frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/dependency-install.log"

      - name: Patch VLC for Android compatibility and runtime metrics
        shell: bash
        run: |
          set -o pipefail
          VLC_DIR="$(cd artifacts/legendstream-xplayer && node -p "require('path').dirname(require.resolve('react-native-vlc-media-player/package.json'))")"
          python3 artifacts/legendstream-xplayer/scripts/patch-vlc-android.py "$VLC_DIR" 2>&1 | tee "$GITHUB_WORKSPACE/vlc-patch.log"
          python3 artifacts/legendstream-xplayer/scripts/patch-vlc-progress-metrics.py "$VLC_DIR" 2>&1 | tee -a "$GITHUB_WORKSPACE/vlc-patch.log"

      - name: Generate Android project
        working-directory: artifacts/legendstream-xplayer
        env:
          EXPO_NO_DOCTOR: "1"
          NODE_ENV: production
        shell: bash
        run: |
          set -o pipefail
          pnpm exec expo prebuild --platform android --clean --no-install 2>&1 | tee "$GITHUB_WORKSPACE/expo-prebuild.log"
          grep '^reactNativeArchitectures=' android/gradle.properties || true
          sed -n '/signingConfigs {/,/buildTypes {/p' android/app/build.gradle
          sed -n '/buildTypes {/,/packagingOptions/p' android/app/build.gradle | head -n 80

      - name: Assert #312 package and signing identity before build
        working-directory: artifacts/legendstream-xplayer
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PACKAGE='com.legendstream.xplayer'
          EXPECTED_CERT_SHA256='FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C'

          PACKAGE="$(node -p "require('./app.json').expo.android.package")"
          echo "applicationId=$PACKAGE"
          test "$PACKAGE" = "$EXPECTED_PACKAGE"

          grep -Fq 'signingConfig signingConfigs.debug' android/app/build.gradle
          test -f android/app/debug.keystore

          CERT_SHA256="$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          echo "generated signing certificate SHA-256=$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          echo 'SIGNING_IDENTITY_MATCHES_312=yes'

      - name: Prepare staging
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/release-staging"
          mkdir -p "$GITHUB_WORKSPACE/release-staging"

      - name: Build release arm64 APK using #312 Gradle path
        working-directory: artifacts/legendstream-xplayer/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.workers.max=2
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -PabiSplit -PabiOnly=arm64-v8a -PreactNativeArchitectures=arm64-v8a --no-daemon --no-build-cache --max-workers=2 --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/apk-release-build.log"

      - name: Verify package, ABI and final APK certificate
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PACKAGE='com.legendstream.xplayer'
          EXPECTED_CERT_SHA256='FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C'
          APK_DIR='artifacts/legendstream-xplayer/android/app/build/outputs/apk/release'
          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"

          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 "$APK" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo '::error::Unexpected ABI in arm64 diagnostic APK'
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          echo "$BADGING"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          test "$PACKAGE" = "$EXPECTED_PACKAGE"

          CERT_SHA256="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          echo "final APK certificate SHA-256=$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          echo 'FINAL_CERT_MATCHES_312=yes'

          OUT="$GITHUB_WORKSPACE/release-staging/LegendStream-XPlayer-v1.4.28-A1-credential-diagnostics-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload approved diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-A1-Credential-Diagnostics-arm64-v8a
          path: release-staging/LegendStream-XPlayer-v1.4.28-A1-credential-diagnostics-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-A1-Diagnostics-Build-Evidence
          path: |
            dependency-install.log
            vlc-patch.log
            expo-prebuild.log
            apk-release-build.log
          if-no-files-found: ignore
          retention-days: 7
