name: Align provider switch regression

on:
  push:
    branches:
      - fix/m3u-routing-verification
    paths:
      - .github/workflows/align-provider-switch-regression.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3u-routing-verification
      - name: Replace stale source assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/legendstream-xplayer/tests/providerSwitchScenarios.ts')
          text = path.read_text()
          old = r'''    assert.match(screenSource, /if \(prepared\) \{\s*setVod\(prepared\.snapshot\.movies\);/s);'''
          new = r'''    assert.match(screenSource, /const preparedSnapshot = prepared\?\.snapshot \?\? null;/);
    assert.match(screenSource, /setVod\(preparedSnapshot\?\.movies \?\? \[\]\);/);
    assert.doesNotMatch(screenSource, /if \(prepared\) \{\s*setVod\(/s);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit aligned regression and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-provider-switch-regression.yml
          git add artifacts/legendstream-xplayer/tests/providerSwitchScenarios.ts
          git commit -m "test: require unconditional prepared snapshot publication"
          git push origin HEAD:fix/m3u-routing-verification
