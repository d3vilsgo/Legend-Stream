name: 9.6 Log Inventory

on:
  push:
    branches:
      - security/log-redaction-96
    paths:
      - '.github/workflows/zz-96-log-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inventory all non-test console calls
        shell: bash
        run: |
          set -u
          pattern='console\.(log|warn|error|info|debug|trace)'
          echo '=== XPLAYER NON-TEST CONSOLE CALLS ==='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=tests --exclude-dir=.credential-tests --exclude-dir=.backup-tests \
            "$pattern" artifacts/legendstream-xplayer 2>/dev/null || true
          echo '=== API NON-TEST CONSOLE CALLS ==='
          grep -RInE --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            --exclude-dir=node_modules --exclude-dir=tests \
            "$pattern" artifacts/api-server 2>/dev/null || true
