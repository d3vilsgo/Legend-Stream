name: PR-1C-12 Stage

on:
  push:
    branches: [security/catalog-cache-safe-dto-12]

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, 'safe catalog DTOs and runtime resolution') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/catalog-cache-safe-dto-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Recover and apply verified staging payload
        shell: bash
        run: |
          git show 7f10e1ee80d557d30565e610e201cd31a419e1c0:.github/workflows/zz-pr1c12-stage.yml > /tmp/pr1c-original.yml
          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/pr1c-original.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          body = raw[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          # The original temporary YAML was only a transport envelope. Some
          # continuation lines inside Python triple-quoted patch anchors lost
          # their YAML-only indentation. Restore only those known source lines;
          # this does not change the intended application patch.
          for token in [
              'itemName(kind, item),',
              'itemImage(kind, item),',
              'JSON.stringify(item),',
              'itemAdded(kind, item),',
              'itemName(persisted),',
              'itemImage(persisted),',
              'JSON.stringify(persisted),',
              'itemAdded(persisted),',
          ]:
              script = script.replace('\n' + token, '\n          ' + token)
          Path('/tmp/pr1c-stage.py').write_text(script)
          PY
          python3 /tmp/pr1c-stage.py
      - name: Catalog persistence acceptance
        run: pnpm --filter @workspace/legendstream-xplayer test:catalog-persistence
      - name: Existing storage and logging gates
        shell: bash
        run: |
          pnpm --filter @workspace/legendstream-xplayer test:credentials
          pnpm --filter @workspace/legendstream-xplayer test:backup
          pnpm --filter @workspace/legendstream-xplayer test:logging
          node scripts/check-console-usage.mjs
      - name: Typecheck mobile
        run: pnpm --filter @workspace/legendstream-xplayer typecheck
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Commit verified PR-1C/1+2 source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/legendstream-xplayer
          git commit -m "security: stage PR-1C/1+2 safe catalog DTOs and runtime resolution"
          git push origin HEAD:security/catalog-cache-safe-dto-12
