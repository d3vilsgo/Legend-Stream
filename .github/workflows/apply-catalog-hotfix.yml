name: Apply catalog hotfix

on:
  push:
    branches:
      - hotfix/xtream-count-first-category-drawer
    paths:
      - scripts/apply_xtream_count_first_category_drawer_hotfix.py
      - .github/workflows/apply-catalog-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 scripts/apply_xtream_count_first_category_drawer_hotfix.py
      - name: Remove temporary applicator
        run: rm -f scripts/apply_xtream_count_first_category_drawer_hotfix.py .github/workflows/apply-catalog-hotfix.yml
      - name: Commit source hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(catalog): show Xtream category fallback and isolate drawer scroll [hotfix-applied]"
          git push origin HEAD:hotfix/xtream-count-first-category-drawer
