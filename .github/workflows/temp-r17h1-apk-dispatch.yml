name: Temp R17-H1 APK Dispatch

on:
  push:
    branches:
      - build/r17-h1-apk-95b42e7f

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative Android APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-apk.yml/dispatches \
            -d '{"ref":"build/r17-h1-apk-95b42e7f","inputs":{"dual_abi":"false","catalog_benchmark":"false"}}'
