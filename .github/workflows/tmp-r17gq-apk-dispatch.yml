name: Temp R17-Z2B APK Dispatch

on:
  push:
    branches:
      - tmp/r17gq-apk-build

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android APK from verified PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/android-apk.yml/dispatches \
            -d '{"ref":"fix/stalker-r17b-physical-gaps","inputs":{"dual_abi":"false","catalog_benchmark":"false"}}'
