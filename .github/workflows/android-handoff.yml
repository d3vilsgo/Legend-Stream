name: Android Build Handoff

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-handoff.yml"
  workflow_run:
    workflows:
      - "Android APK"
    types:
      - completed

permissions:
  actions: write
  issues: write
  contents: read

jobs:
  dispatch-main-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android APK on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --repo "$GITHUB_REPOSITORY" --ref main

  report-android-run:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Report run id to merged PR #11
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr comment 11 --repo "$GITHUB_REPOSITORY" --body "ANDROID_RUN_ID=${RUN_ID}\nANDROID_RUN_CONCLUSION=${RUN_CONCLUSION}\nANDROID_RUN_SHA=${RUN_SHA}"
