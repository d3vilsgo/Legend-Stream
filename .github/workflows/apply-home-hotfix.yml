name: Apply Home Hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-home-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/home-counters-fast-content
          fetch-depth: 0

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-home-media-loading-hotfix.py
          rm scripts/apply-home-media-loading-hotfix.py
          git diff --check

      - name: Commit and push source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "d3vilsgo"
          git config user.email "80721458+d3vilsgo@users.noreply.github.com"
          git add artifacts/legendstream-xplayer/components/OptimizedHomeScreenV6.tsx scripts/apply-home-media-loading-hotfix.py
          git commit -m "fix(home): show continue shelf hydration state"
          git push origin HEAD:hotfix/home-counters-fast-content
