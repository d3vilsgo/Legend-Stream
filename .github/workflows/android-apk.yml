name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "artifacts/legendstream-xplayer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          docker system prune -af --volumes || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/legendstream-xplayer... install --no-frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/dependency-install.log"

      - name: Patch VLC for Android compatibility and runtime metrics
        shell: bash
        run: |
          set -o pipefail
          VLC_DIR="$(cd artifacts/legendstream-xplayer && node -p "require('path').dirname(require.resolve('react-native-vlc-media-player/package.json'))")"
          echo "Resolved VLC directory: $VLC_DIR"
          python3 artifacts/legendstream-xplayer/scripts/patch-vlc-android.py "$VLC_DIR" 2>&1 | tee "$GITHUB_WORKSPACE/vlc-patch.log"
          python3 artifacts/legendstream-xplayer/scripts/patch-vlc-progress-metrics.py "$VLC_DIR" 2>&1 | tee -a "$GITHUB_WORKSPACE/vlc-patch.log"

      - name: Generate Android project
        working-directory: artifacts/legendstream-xplayer
        env:
          EXPO_NO_DOCTOR: "1"
          NODE_ENV: production
        shell: bash
        run: |
          set -o pipefail
          pnpm exec expo prebuild --platform android --clean --no-install 2>&1 | tee "$GITHUB_WORKSPACE/expo-prebuild.log"
          echo "Generated architectures:"
          grep '^reactNativeArchitectures=' android/gradle.properties || true
          echo "Generated ABI split block:"
          sed -n '/@legendstream abi-splits:start/,/@legendstream abi-splits:end/p' android/app/build.gradle
          grep -n "libc++_shared.so" android/app/build.gradle || true

      - name: Upload prepare diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Prepare-Diagnostics
          path: |
            dependency-install.log
            vlc-patch.log
            expo-prebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and stage production AAB
        working-directory: artifacts/legendstream-xplayer/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.workers.max=2
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew bundleRelease \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/aab-release-build.log"

          STAGE_DIR="$GITHUB_WORKSPACE/release-staging"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          mapfile -t AABS < <(find app/build/outputs/bundle/release -type f -name '*.aab' | sort)
          if [ "${#AABS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one release AAB before clean, found ${#AABS[@]}"
            printf '%s\n' "${AABS[@]:-<none>}"
            exit 1
          fi

          cp "${AABS[0]}" "$STAGE_DIR/LegendStream-XPlayer-production.aab"
          echo "Staged AAB outside Gradle build tree before clean:"
          stat -c '%n %s' "$STAGE_DIR"/*.aab

      - name: Clean before split APK build
        working-directory: artifacts/legendstream-xplayer/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --console=plain
          test -f "$GITHUB_WORKSPACE/release-staging/LegendStream-XPlayer-production.aab"

      - name: Build per-ABI release APKs
        working-directory: artifacts/legendstream-xplayer/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.workers.max=2
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PabiSplit \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/apk-release-build.log"

      - name: Show release diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "================ AAB IMPORTANT ERROR LINES ================"
          grep -Ein -C 4 "error|exception|failed|failure|unable|cannot|could not|syntax|module not found|no space|keystore|signing|bundle|manifest|minSdk|vlc|libvlc|duplicate|merge|kotlin|java|versionCode|abi|shrunk-resources" aab-release-build.log 2>/dev/null | tail -n 420 || true
          echo "================ AAB LAST LOG LINES ======================="
          tail -n 320 aab-release-build.log 2>/dev/null || true
          echo "================ APK IMPORTANT ERROR LINES ================"
          grep -Ein -C 4 "error|exception|failed|failure|unable|cannot|could not|syntax|module not found|no space|keystore|signing|bundle|manifest|minSdk|vlc|libvlc|duplicate|merge|kotlin|java|versionCode|abi|shrunk-resources" apk-release-build.log 2>/dev/null | tail -n 420 || true
          echo "================ APK LAST LOG LINES ======================="
          tail -n 320 apk-release-build.log 2>/dev/null || true
          echo "================ PREBUILD LOG ============================="
          tail -n 260 expo-prebuild.log 2>/dev/null || true

      - name: Upload release build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Release-Build-Logs
          path: |
            aab-release-build.log
            apk-release-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify ABI contents, versionCodes and package outputs
        id: package_android
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="artifacts/legendstream-xplayer/android/app/build/outputs/apk/release"
          STAGE_DIR="$GITHUB_WORKSPACE/release-staging"

          echo "================ APK OUTPUTS ================"
          find "$APK_DIR" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          echo "================ STAGING OUTPUTS ============"
          find "$STAGE_DIR" -maxdepth 1 -type f -printf '%p %s bytes\n' | sort || true

          mapfile -t APKS < <(find "$APK_DIR" -type f -name '*.apk' | sort)
          mapfile -t AABS < <(find "$STAGE_DIR" -maxdepth 1 -type f -name '*.aab' | sort)

          if [ "${#APKS[@]}" -ne 2 ]; then
            echo "::error::Expected exactly two split release APKs, found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]:-<none>}"
            exit 1
          fi
          if [ "${#AABS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one staged release AAB, found ${#AABS[@]}"
            printf '%s\n' "${AABS[@]:-<none>}"
            exit 1
          fi

          AAB_PATH="${AABS[0]}"
          ARM64_APK=""
          ARMV7_APK=""

          for apk in "${APKS[@]}"; do
            HAS_ARM64=0
            HAS_ARMV7=0
            if unzip -Z1 "$apk" | grep -q '^lib/arm64-v8a/'; then HAS_ARM64=1; fi
            if unzip -Z1 "$apk" | grep -q '^lib/armeabi-v7a/'; then HAS_ARMV7=1; fi

            if [ "$HAS_ARM64" -eq 1 ] && [ "$HAS_ARMV7" -eq 0 ]; then
              ARM64_APK="$apk"
            elif [ "$HAS_ARMV7" -eq 1 ] && [ "$HAS_ARM64" -eq 0 ]; then
              ARMV7_APK="$apk"
            else
              echo "::error::Could not classify split APK by native ABI: $apk"
              unzip -Z1 "$apk" | grep '^lib/' | head -n 80 || true
              exit 1
            fi
          done

          if [ -z "$ARM64_APK" ] || [ -z "$ARMV7_APK" ]; then
            echo "::error::Both ARM split APKs were not discovered from actual *.apk outputs."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          # x86/x86_64 is forbidden only in the sideload APK deliverables.
          # The production AAB intentionally remains multi-ABI so Google Play can split per device.
          for apk in "${APKS[@]}"; do
            if unzip -Z1 "$apk" | grep -Eq '^lib/(x86|x86_64)/'; then
              echo "::error::Unexpected x86/x86_64 native library in split APK: $apk"
              exit 1
            fi
          done

          AAB_ABIS="$(unzip -Z1 "$AAB_PATH" | awk -F/ '/^base\/lib\// {print $3}' | sort -u | xargs)"
          echo "AAB ABIs (informational; x86/x86_64 is allowed here): $AAB_ABIS"
          echo "$AAB_ABIS" | grep -qw 'arm64-v8a'
          echo "$AAB_ABIS" | grep -qw 'armeabi-v7a'

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ ! -x "$AAPT" ]; then
            echo "::error::aapt not found under $ANDROID_HOME/build-tools"
            exit 1
          fi

          ARM64_CODE="$($AAPT dump badging "$ARM64_APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          ARMV7_CODE="$($AAPT dump badging "$ARMV7_APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "arm64-v8a versionCode=$ARM64_CODE"
          echo "armeabi-v7a versionCode=$ARMV7_CODE"
          test -n "$ARM64_CODE" && test -n "$ARMV7_CODE"
          if [ "$ARM64_CODE" = "$ARMV7_CODE" ]; then
            echo "::error::Split APK versionCodes collide: $ARM64_CODE"
            exit 1
          fi

          APP_VERSION="$(node -p "require('./artifacts/legendstream-xplayer/app.json').expo.version")"
          ARM64_NAME="LegendStream-XPlayer-v${APP_VERSION}-arm64-v8a.apk"
          ARMV7_NAME="LegendStream-XPlayer-v${APP_VERSION}-armeabi-v7a.apk"
          AAB_NAME="LegendStream-XPlayer-v${APP_VERSION}-production.aab"

          cp "$ARM64_APK" "$STAGE_DIR/$ARM64_NAME"
          cp "$ARMV7_APK" "$STAGE_DIR/$ARMV7_NAME"
          mv "$AAB_PATH" "$STAGE_DIR/$AAB_NAME"

          ARM64_BYTES="$(stat -c%s "$STAGE_DIR/$ARM64_NAME")"
          ARMV7_BYTES="$(stat -c%s "$STAGE_DIR/$ARMV7_NAME")"
          AAB_BYTES="$(stat -c%s "$STAGE_DIR/$AAB_NAME")"
          echo "arm64 APK bytes=$ARM64_BYTES"
          echo "armv7 APK bytes=$ARMV7_BYTES"
          echo "AAB bytes=$AAB_BYTES"
          echo "Final staged release outputs:"
          stat -c '%n %s' "$STAGE_DIR"/*.apk "$STAGE_DIR"/*.aab

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "arm64_bytes=$ARM64_BYTES" >> "$GITHUB_OUTPUT"
          echo "armv7_bytes=$ARMV7_BYTES" >> "$GITHUB_OUTPUT"
          echo "aab_bytes=$AAB_BYTES" >> "$GITHUB_OUTPUT"

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-v${{ steps.package_android.outputs.app_version }}-arm64-v8a
          path: release-staging/*-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-v${{ steps.package_android.outputs.app_version }}-armeabi-v7a
          path: release-staging/*-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-v${{ steps.package_android.outputs.app_version }}-production-aab
          path: release-staging/*.aab
          if-no-files-found: error
          retention-days: 14
