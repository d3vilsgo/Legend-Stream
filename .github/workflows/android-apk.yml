name: Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "artifacts/legendstream-xplayer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          docker system prune -af --volumes || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/legendstream-xplayer... install --no-frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/dependency-install.log"

      - name: Patch VLC for Android compatibility and runtime metrics
        shell: bash
        run: |
          set -o pipefail
          VLC_DIR="$(cd artifacts/legendstream-xplayer && node -p "require('path').dirname(require.resolve('react-native-vlc-media-player/package.json'))")"
          echo "Resolved VLC directory: $VLC_DIR"
          python3 artifacts/legendstream-xplayer/scripts/patch-vlc-android.py "$VLC_DIR" 2>&1 | tee "$GITHUB_WORKSPACE/vlc-patch.log"
          python3 artifacts/legendstream-xplayer/scripts/patch-vlc-progress-metrics.py "$VLC_DIR" 2>&1 | tee -a "$GITHUB_WORKSPACE/vlc-patch.log"

      - name: Generate Android project
        working-directory: artifacts/legendstream-xplayer
        env:
          EXPO_NO_DOCTOR: "1"
          NODE_ENV: production
        shell: bash
        run: |
          set -o pipefail
          pnpm exec expo prebuild --platform android --clean --no-install 2>&1 | tee "$GITHUB_WORKSPACE/expo-prebuild.log"

      - name: Upload prepare diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Prepare-Diagnostics
          path: |
            dependency-install.log
            vlc-patch.log
            expo-prebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Check disk before Gradle
        run: |
          echo "Disk before Gradle:"
          df -h /
          du -sh node_modules artifacts/legendstream-xplayer/node_modules artifacts/legendstream-xplayer/android 2>/dev/null || true

      - name: Build standalone release APK
        working-directory: artifacts/legendstream-xplayer/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.workers.max=2
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/release-build.log"

      - name: Show release diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "================ IMPORTANT ERROR LINES ================"
          grep -Ein -C 4 "error|exception|failed|failure|unable|cannot|could not|syntax|module not found|no space|keystore|signing|bundle|manifest|minSdk|vlc|libvlc|duplicate|merge|kotlin|java" release-build.log 2>/dev/null | tail -n 420 || true
          echo "================ LAST 420 LOG LINES ===================="
          tail -n 420 release-build.log 2>/dev/null || true
          echo "================ PREBUILD LOG ==========================="
          tail -n 220 expo-prebuild.log 2>/dev/null || true
          echo "================ VLC PATCH LOG =========================="
          cat vlc-patch.log 2>/dev/null || true
          echo "================ DEPENDENCY LOG ========================="
          tail -n 160 dependency-install.log 2>/dev/null || true
          echo "========================================================="

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Release-Build-Log
          path: release-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package beta APK
        id: package_apk
        shell: bash
        run: |
          mkdir -p apk-output
          APK_PATH="$(find artifacts/legendstream-xplayer/android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi

          APP_VERSION="$(node -p "require('./artifacts/legendstream-xplayer/app.json').expo.version")"
          APK_NAME="LegendStream-XPlayer-v${APP_VERSION}-beta.apk"

          cp "$APK_PATH" "apk-output/$APK_NAME"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "apk-output/$APK_NAME"

      - name: Upload beta APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-v${{ steps.package_apk.outputs.app_version }}-beta
          path: apk-output/${{ steps.package_apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
