name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/legendstream-xplayer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af --volumes || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies only
        run: pnpm --filter @workspace/legendstream-xplayer... install --no-frozen-lockfile

      - name: Patch VLC module for Android 7+
        shell: bash
        run: |
          VLC_GRADLE="$(realpath artifacts/legendstream-xplayer/node_modules/react-native-vlc-media-player/android/build.gradle)"
          if [ ! -f "$VLC_GRADLE" ]; then
            echo "VLC Android build.gradle not found"
            exit 1
          fi
          echo "Patching $VLC_GRADLE"
          sed -Ei 's/minSdkVersion[[:space:]]+26/minSdkVersion 24/' "$VLC_GRADLE"
          grep -nE 'compileSdkVersion|minSdkVersion|libvlc-all' "$VLC_GRADLE"

      - name: Generate Android project
        working-directory: artifacts/legendstream-xplayer
        env:
          EXPO_NO_DOCTOR: "1"
          NODE_ENV: production
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Check disk before Gradle
        run: |
          echo "Disk before Gradle:"
          df -h /
          du -sh node_modules artifacts/legendstream-xplayer/node_modules artifacts/legendstream-xplayer/android 2>/dev/null || true

      - name: Build standalone release APK
        id: release_build
        continue-on-error: true
        working-directory: artifacts/legendstream-xplayer/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.workers.max=2
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/release-build.log"

      - name: Show release build diagnostics
        if: steps.release_build.outcome == 'failure'
        shell: bash
        run: |
          echo "================ IMPORTANT ERROR LINES ================"
          grep -Ein -C 4 "error|exception|failed|failure|unable|cannot|could not|syntax|module not found|no space|keystore|signing|bundle|manifest|minSdk" release-build.log | tail -n 280 || true
          echo "================ LAST 280 LOG LINES ===================="
          tail -n 280 release-build.log || true
          echo "================ DISK AFTER FAILURE ====================="
          df -h / || true

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Release-Build-Log
          path: release-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop on release build failure
        if: steps.release_build.outcome == 'failure'
        run: exit 1

      - name: Copy release APK
        run: |
          mkdir -p apk-output
          APK_PATH=$(find artifacts/legendstream-xplayer/android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi
          cp "$APK_PATH" apk-output/LegendStream-XPlayer-release.apk
          ls -lh apk-output/LegendStream-XPlayer-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Android-Release
          path: apk-output/LegendStream-XPlayer-release.apk
          if-no-files-found: error
          retention-days: 14
