name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/legendstream-xplayer/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/hostedtoolcache/Ruby || true
          sudo rm -rf /opt/hostedtoolcache/go || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af --volumes || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies only
        id: deps
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/legendstream-xplayer... install --no-frozen-lockfile 2>&1 | tee "$GITHUB_WORKSPACE/dependency-install.log"

      - name: Verify and patch VLC for Android 7+ and PiP
        id: vlc_patch
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            VLC_PKG="$(cd artifacts/legendstream-xplayer && node -p "require.resolve('react-native-vlc-media-player/package.json')")"
            VLC_DIR="$(dirname "$VLC_PKG")"
            VLC_GRADLE="$VLC_DIR/android/build.gradle"
            VLC_VIEW="$VLC_DIR/android/src/main/java/com/yuanzhou/vlc/vlcplayer/ReactVlcPlayerView.java"
            export VLC_DIR VLC_GRADLE VLC_VIEW

            echo "Resolved VLC package: $VLC_DIR"
            node -e "const p=require('$VLC_PKG'); console.log('VLC version:', p.version)"
            test -f "$VLC_GRADLE"
            test -f "$VLC_VIEW"

            echo "Before Gradle patch:"
            grep -nE 'compileSdkVersion|minSdkVersion|libvlc-all' "$VLC_GRADLE" || true
            sed -Ei 's/minSdkVersion[[:space:]]+26/minSdkVersion 24/g' "$VLC_GRADLE"

            python3 - <<'PY'
          import os
          from pathlib import Path

          view_path = Path(os.environ["VLC_VIEW"])
          text = view_path.read_text(encoding="utf-8")

          # Upstream 1.0.98 skips the final VLC init/media option because both loops
          # end at size()-1. This can silently drop a cache/decoder option.
          text = text.replace(
              "for (int i = 0; i < options.size() - 1; i++)",
              "for (int i = 0; i < options.size(); i++)",
          )

          # React Native calls onHostPause while Android is entering PiP. Upstream
          # unconditionally pauses libVLC there, which freezes the PiP frame.
          if "isInPictureInPictureMode()" not in text:
              needle = """    @Override\n    public void onHostPause() {\n        if (!isPaused && mMediaPlayer != null && !isReleased) {"""
              replacement = """    @Override\n    public void onHostPause() {\n        if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O\n                && themedReactContext.getCurrentActivity() != null\n                && themedReactContext.getCurrentActivity().isInPictureInPictureMode()) {\n            return;\n        }\n        if (!isPaused && mMediaPlayer != null && !isReleased) {"""
              if needle not in text:
                  raise SystemExit("Could not locate VLC onHostPause() for PiP patch")
              text = text.replace(needle, replacement, 1)

          view_path.write_text(text, encoding="utf-8")
          PY

            echo "After Gradle patch:"
            grep -nE 'compileSdkVersion|minSdkVersion|libvlc-all' "$VLC_GRADLE" || true
            echo "VLC option/PiP verification:"
            grep -nE 'options\.size\(\)|isInPictureInPictureMode' "$VLC_VIEW" | head -n 20 || true

            if grep -Eq 'minSdkVersion[[:space:]]+26' "$VLC_GRADLE"; then
              echo "VLC minSdk patch did not apply"
              exit 1
            fi
            if grep -q 'options.size() - 1' "$VLC_VIEW"; then
              echo "VLC option loop patch did not apply"
              exit 1
            fi
            if ! grep -q 'isInPictureInPictureMode()' "$VLC_VIEW"; then
              echo "VLC PiP lifecycle patch did not apply"
              exit 1
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/vlc-patch.log"

      - name: Generate Android project
        id: prebuild
        if: steps.deps.outcome == 'success' && steps.vlc_patch.outcome == 'success'
        continue-on-error: true
        working-directory: artifacts/legendstream-xplayer
        env:
          EXPO_NO_DOCTOR: "1"
          NODE_ENV: production
        shell: bash
        run: |
          set -o pipefail
          pnpm exec expo prebuild --platform android --clean --no-install 2>&1 | tee "$GITHUB_WORKSPACE/expo-prebuild.log"

      - name: Upload prepare diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Prepare-Diagnostics
          path: |
            dependency-install.log
            vlc-patch.log
            expo-prebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop on prepare failure
        if: steps.deps.outcome == 'failure' || steps.vlc_patch.outcome == 'failure' || steps.prebuild.outcome == 'failure'
        run: |
          echo "Preparation failed. Download LegendStream-XPlayer-Prepare-Diagnostics for the exact error."
          exit 1

      - name: Check disk before Gradle
        run: |
          echo "Disk before Gradle:"
          df -h /
          du -sh node_modules artifacts/legendstream-xplayer/node_modules artifacts/legendstream-xplayer/android 2>/dev/null || true

      - name: Build standalone release APK
        id: release_build
        continue-on-error: true
        working-directory: artifacts/legendstream-xplayer/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=false -Dorg.gradle.workers.max=2
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --max-workers=2 \
            --console=plain \
            --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/release-build.log"

      - name: Show release build diagnostics
        if: steps.release_build.outcome == 'failure'
        shell: bash
        run: |
          echo "================ IMPORTANT ERROR LINES ================"
          grep -Ein -C 4 "error|exception|failed|failure|unable|cannot|could not|syntax|module not found|no space|keystore|signing|bundle|manifest|minSdk|vlc|libvlc|duplicate|merge" release-build.log | tail -n 360 || true
          echo "================ LAST 360 LOG LINES ===================="
          tail -n 360 release-build.log || true
          echo "================ DISK AFTER FAILURE ====================="
          df -h / || true

      - name: Upload release build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Release-Build-Log
          path: release-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop on release build failure
        if: steps.release_build.outcome == 'failure'
        run: exit 1

      - name: Copy release APK
        run: |
          mkdir -p apk-output
          APK_PATH=$(find artifacts/legendstream-xplayer/android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found"
            exit 1
          fi
          cp "$APK_PATH" apk-output/LegendStream-XPlayer-release.apk
          ls -lh apk-output/LegendStream-XPlayer-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendStream-XPlayer-Android-Release
          path: apk-output/LegendStream-XPlayer-release.apk
          if-no-files-found: error
          retention-days: 14
