name: Align local tab regression

on:
  push:
    branches:
      - fix/m3u-routing-verification
    paths:
      - .github/workflows/align-local-tab-regression.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3u-routing-verification
      - name: Replace stale local loader assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/legendstream-xplayer/tests/providerSwitchScenarios.ts')
          text = path.read_text()
          old = '''    assert.match(screenSource, /loadLocalMovies: applyLocalVod/);
    assert.match(screenSource, /loadLocalSeries: applyLocalSeries/);'''
          new = r'''    assert.match(screenSource, /loadLocalMovies: \(\) => \{ void applyLocalVod\(\); \}/);
    assert.match(screenSource, /loadLocalSeries: \(\) => \{ void applyLocalSeries\(\); \}/);'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale local-loader assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit aligned regression and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/align-local-tab-regression.yml
          git add artifacts/legendstream-xplayer/tests/providerSwitchScenarios.ts
          git commit -m "test: require cooperative local tab loaders"
          git push origin HEAD:fix/m3u-routing-verification
