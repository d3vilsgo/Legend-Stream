name: Apply M3U Transport Routing

on:
  push:
    branches: [fix/m3u-staging-swap-v2]
    paths:
      - scripts/apply-m3u-transport-routing.py
      - .github/workflows/apply-m3u-transport-routing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m3u-staging-swap-v2
          fetch-depth: 0
      - name: Apply exact routing patch
        run: python scripts/apply-m3u-transport-routing.py
      - name: Remove temporary patch helpers
        run: |
          rm scripts/apply-m3u-transport-routing.py
          rm .github/workflows/apply-m3u-transport-routing.yml
      - name: Validate and push
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: route credentialed M3U through Xtream transport"
          git push origin HEAD:fix/m3u-staging-swap-v2
