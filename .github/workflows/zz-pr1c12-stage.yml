name: PR-1C-12 Stage

on:
  push:
    branches: [security/catalog-cache-safe-dto-12]

permissions:
  contents: write

jobs:
  stage:
    if: ${{ !contains(github.event.head_commit.message, 'security: stage PR-1C/1+2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/catalog-cache-safe-dto-12
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply PR-1C/1+2 safe catalog DTO and runtime patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          mobile = root / 'artifacts/legendstream-xplayer'

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1))

          def replace_all(path: Path, old: str, new: str, minimum: int = 1):
              text = path.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'expected at least {minimum} matches in {path}, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new))

          def replace_between(path: Path, start: str, end: str, replacement: str):
              text = path.read_text()
              a = text.find(start)
              b = text.find(end, a)
              if a < 0 or b < 0:
                  raise SystemExit(f'patch range missing in {path}: {start!r} -> {end!r}')
              path.write_text(text[:a] + replacement + text[b:])

          (mobile / 'lib/catalogPersistence.ts').write_text(r'''import type { Channel } from "./iptv";
import type { XtreamSeriesItem, XtreamVodItem } from "./xtreamCatalog";

export type CatalogKind = "live" | "vod" | "series";
export type CatalogSourceMode = "canonical" | "direct";

export type PersistedLivePlaybackRef =
  | {
      type: "xtream-live";
      streamId: string;
      containerExtension: string;
    }
  | { type: "unresolved" };

export type PersistedVodPlaybackRef = {
  type: "xtream-vod";
  streamId: string;
  containerExtension: string;
  sourceMode: CatalogSourceMode;
};

export type PersistedLiveCatalogItem = {
  schemaVersion: 1;
  catalogKind: "live";
  providerId: string;
  id: string;
  name: string;
  logoUrl?: string;
  category: string;
  tvgId?: string;
  streamType?: string;
  contentType: "live";
  nowPlaying?: string;
  nextPlaying?: string;
  playbackRef: PersistedLivePlaybackRef;
};

export type PersistedVodCatalogItem = {
  schemaVersion: 1;
  catalogKind: "vod";
  providerId: string;
  stream_id: string | number;
  name: string;
  stream_icon?: string;
  rating?: string | number;
  rating_5based?: number;
  added?: string;
  category_id?: string | number;
  container_extension?: string;
  plot?: string;
  cast?: string;
  director?: string;
  genre?: string;
  releaseDate?: string;
  release_date?: string;
  youtube_trailer?: string;
  playbackRef: PersistedVodPlaybackRef;
};

export type PersistedSeriesCatalogItem = {
  schemaVersion: 1;
  catalogKind: "series";
  providerId: string;
  series_id: string | number;
  name: string;
  cover?: string;
  plot?: string;
  cast?: string;
  director?: string;
  genre?: string;
  releaseDate?: string;
  release_date?: string;
  rating?: string | number;
  category_id?: string | number;
  backdrop_path?: string[];
};

export type PersistedCatalogItem =
  | PersistedLiveCatalogItem
  | PersistedVodCatalogItem
  | PersistedSeriesCatalogItem;

const asObject = (value: unknown): Record<string, unknown> | null =>
  value && typeof value === "object" && !Array.isArray(value)
    ? value as Record<string, unknown>
    : null;

const stringValue = (value: unknown) => typeof value === "string" ? value : undefined;
const numberValue = (value: unknown) => typeof value === "number" && Number.isFinite(value) ? value : undefined;
const stringOrNumber = (value: unknown) =>
  typeof value === "string" || (typeof value === "number" && Number.isFinite(value))
    ? value
    : undefined;
const stringArray = (value: unknown) =>
  Array.isArray(value) ? value.filter((item): item is string => typeof item === "string") : undefined;

function parseXtreamLivePlaybackRef(source: unknown): PersistedLivePlaybackRef {
  if (typeof source !== "string" || !source) return { type: "unresolved" };
  try {
    const url = new URL(source);
    const match = url.pathname.match(/\/live\/[^/]+\/[^/]+\/([^/]+)$/i);
    if (!match) return { type: "unresolved" };
    const file = decodeURIComponent(match[1]);
    const dot = file.lastIndexOf(".");
    if (dot <= 0 || dot === file.length - 1) return { type: "unresolved" };
    const streamId = file.slice(0, dot);
    const containerExtension = file.slice(dot + 1);
    if (!streamId || !/^[a-zA-Z0-9]{1,10}$/.test(containerExtension)) {
      return { type: "unresolved" };
    }
    return { type: "xtream-live", streamId, containerExtension };
  } catch {
    return { type: "unresolved" };
  }
}

function normalizeLivePlaybackRef(value: unknown): PersistedLivePlaybackRef {
  const raw = asObject(value);
  if (!raw) return { type: "unresolved" };
  if (raw.type === "xtream-live") {
    const streamId = stringValue(raw.streamId);
    const containerExtension = stringValue(raw.containerExtension);
    if (streamId && containerExtension && /^[a-zA-Z0-9]{1,10}$/.test(containerExtension)) {
      return { type: "xtream-live", streamId, containerExtension };
    }
  }
  return { type: "unresolved" };
}

function normalizeVodPlaybackRef(value: unknown, fallback: Record<string, unknown>): PersistedVodPlaybackRef | null {
  const raw = asObject(value);
  const streamId = stringValue(raw?.streamId) ?? String(stringOrNumber(fallback.stream_id) ?? "");
  if (!streamId) return null;
  const rawExtension = stringValue(raw?.containerExtension) ?? stringValue(fallback.container_extension) ?? "mp4";
  const containerExtension = /^[a-zA-Z0-9]{1,10}$/.test(rawExtension) ? rawExtension : "mp4";
  const sourceMode: CatalogSourceMode = raw?.sourceMode === "direct" || Boolean(stringValue(fallback.direct_source))
    ? "direct"
    : "canonical";
  return { type: "xtream-vod", streamId, containerExtension, sourceMode };
}

function projectLive(providerId: string, value: unknown): PersistedLiveCatalogItem | null {
  const raw = asObject(value);
  if (!raw) return null;
  const id = stringValue(raw.id);
  const name = stringValue(raw.name);
  if (!id || !name) return null;
  const playbackRef = raw.schemaVersion === 1 && raw.catalogKind === "live"
    ? normalizeLivePlaybackRef(raw.playbackRef)
    : parseXtreamLivePlaybackRef(raw.streamUrl);
  return {
    schemaVersion: 1,
    catalogKind: "live",
    providerId,
    id,
    name,
    logoUrl: stringValue(raw.logoUrl),
    category: stringValue(raw.category) ?? "Live TV",
    tvgId: stringValue(raw.tvgId),
    streamType: stringValue(raw.streamType),
    contentType: "live",
    nowPlaying: stringValue(raw.nowPlaying),
    nextPlaying: stringValue(raw.nextPlaying),
    playbackRef,
  };
}

function projectVod(providerId: string, value: unknown): PersistedVodCatalogItem | null {
  const raw = asObject(value);
  if (!raw) return null;
  const streamId = stringOrNumber(raw.stream_id);
  const name = stringValue(raw.name);
  const playbackRef = normalizeVodPlaybackRef(raw.playbackRef, raw);
  if (streamId === undefined || !name || !playbackRef) return null;
  return {
    schemaVersion: 1,
    catalogKind: "vod",
    providerId,
    stream_id: streamId,
    name,
    stream_icon: stringValue(raw.stream_icon),
    rating: stringOrNumber(raw.rating),
    rating_5based: numberValue(raw.rating_5based),
    added: stringValue(raw.added),
    category_id: stringOrNumber(raw.category_id),
    container_extension: stringValue(raw.container_extension),
    plot: stringValue(raw.plot),
    cast: stringValue(raw.cast),
    director: stringValue(raw.director),
    genre: stringValue(raw.genre),
    releaseDate: stringValue(raw.releaseDate),
    release_date: stringValue(raw.release_date),
    youtube_trailer: stringValue(raw.youtube_trailer),
    playbackRef,
  };
}

function projectSeries(providerId: string, value: unknown): PersistedSeriesCatalogItem | null {
  const raw = asObject(value);
  if (!raw) return null;
  const seriesId = stringOrNumber(raw.series_id);
  const name = stringValue(raw.name);
  if (seriesId === undefined || !name) return null;
  return {
    schemaVersion: 1,
    catalogKind: "series",
    providerId,
    series_id: seriesId,
    name,
    cover: stringValue(raw.cover),
    plot: stringValue(raw.plot),
    cast: stringValue(raw.cast),
    director: stringValue(raw.director),
    genre: stringValue(raw.genre),
    releaseDate: stringValue(raw.releaseDate),
    release_date: stringValue(raw.release_date),
    rating: stringOrNumber(raw.rating),
    category_id: stringOrNumber(raw.category_id),
    backdrop_path: stringArray(raw.backdrop_path),
  };
}

export function projectCatalogItem(
  providerId: string,
  kind: CatalogKind,
  value: Channel | XtreamVodItem | XtreamSeriesItem | unknown,
): PersistedCatalogItem | null {
  if (kind === "live") return projectLive(providerId, value);
  if (kind === "vod") return projectVod(providerId, value);
  return projectSeries(providerId, value);
}

export function projectCatalogItems(
  providerId: string,
  kind: CatalogKind,
  values: Array<Channel | XtreamVodItem | XtreamSeriesItem>,
): PersistedCatalogItem[] {
  return values
    .map((value) => projectCatalogItem(providerId, kind, value))
    .filter((value): value is PersistedCatalogItem => value !== null);
}

export function normalizePersistedCatalogPayload(
  providerId: string,
  kind: CatalogKind,
  raw: unknown,
): PersistedCatalogItem | null {
  // Re-project both v1 runtime payloads and v1-safe DTO payloads through the
  // explicit whitelist. Unknown provider fields can never escape this boundary.
  return projectCatalogItem(providerId, kind, raw);
}

const RUNTIME_SCHEME = "legendstream-catalog:";

export function makeDirectVodRuntimeSource(ref: PersistedVodCatalogItem): string {
  return `legendstream-catalog://xtream/movie/${encodeURIComponent(ref.providerId)}/${encodeURIComponent(ref.playbackRef.streamId)}?ext=${encodeURIComponent(ref.playbackRef.containerExtension)}`;
}

export type CatalogRuntimeSourceRef = {
  kind: "vod-direct";
  providerId: string;
  streamId: string;
  containerExtension: string;
};

export function parseCatalogRuntimeSource(source: string): CatalogRuntimeSourceRef | null {
  if (!source.startsWith(RUNTIME_SCHEME)) return null;
  try {
    const url = new URL(source);
    if (url.protocol !== RUNTIME_SCHEME || url.hostname !== "xtream") return null;
    const parts = url.pathname.split("/").filter(Boolean).map(decodeURIComponent);
    if (parts.length !== 3 || parts[0] !== "movie") return null;
    const containerExtension = url.searchParams.get("ext") || "mp4";
    if (!parts[1] || !parts[2] || !/^[a-zA-Z0-9]{1,10}$/.test(containerExtension)) return null;
    return {
      kind: "vod-direct",
      providerId: parts[1],
      streamId: parts[2],
      containerExtension,
    };
  } catch {
    return null;
  }
}

export function isCatalogRuntimeSource(source: string): boolean {
  return parseCatalogRuntimeSource(source) !== null;
}
''')

          (mobile / 'lib/catalogRuntime.ts').write_text(r'''import type { Channel } from "./iptv";
import { normalizeXtreamBaseUrl } from "./iptv";
import {
  getVodInfo,
  type XtreamSeriesItem,
  type XtreamVodItem,
} from "./xtreamCatalog";
import {
  getCachedPersistedItems,
  getNewCachedPersistedItems,
} from "./catalogCache";
import {
  makeDirectVodRuntimeSource,
  parseCatalogRuntimeSource,
  type PersistedLiveCatalogItem,
  type PersistedSeriesCatalogItem,
  type PersistedVodCatalogItem,
} from "./catalogPersistence";

export type CatalogRuntimeProvider = {
  id: string;
  type: string;
  url?: string;
  playlistUrl?: string;
  username?: string;
  password?: string;
};

function requireXtreamCredentials(provider: CatalogRuntimeProvider) {
  if (provider.type !== "xtream" || !provider.username || !provider.password) {
    throw new Error("Cached playback credentials are unavailable.");
  }
  const source = provider.url || provider.playlistUrl || "";
  return {
    baseUrl: normalizeXtreamBaseUrl(source),
    username: provider.username,
    password: provider.password,
  };
}

function liveRuntimeItem(
  persisted: PersistedLiveCatalogItem,
  provider: CatalogRuntimeProvider,
): Channel {
  let streamUrl = "";
  if (persisted.playbackRef.type === "xtream-live") {
    try {
      const credentials = requireXtreamCredentials(provider);
      if (provider.id === persisted.providerId) {
        streamUrl = `${credentials.baseUrl}/live/${encodeURIComponent(credentials.username)}/${encodeURIComponent(credentials.password)}/${encodeURIComponent(persisted.playbackRef.streamId)}.${persisted.playbackRef.containerExtension}`;
      }
    } catch {
      streamUrl = "";
    }
  }
  return {
    id: persisted.id,
    providerId: persisted.providerId,
    name: persisted.name,
    streamUrl,
    logoUrl: persisted.logoUrl,
    category: persisted.category,
    tvgId: persisted.tvgId,
    streamType: persisted.streamType,
    contentType: "live",
    nowPlaying: persisted.nowPlaying,
    nextPlaying: persisted.nextPlaying,
  };
}

function vodRuntimeItem(persisted: PersistedVodCatalogItem): XtreamVodItem {
  return {
    stream_id: persisted.stream_id,
    name: persisted.name,
    stream_icon: persisted.stream_icon,
    rating: persisted.rating,
    rating_5based: persisted.rating_5based,
    added: persisted.added,
    category_id: persisted.category_id,
    container_extension: persisted.container_extension,
    direct_source: persisted.playbackRef.sourceMode === "direct"
      ? makeDirectVodRuntimeSource(persisted)
      : undefined,
    plot: persisted.plot,
    cast: persisted.cast,
    director: persisted.director,
    genre: persisted.genre,
    releaseDate: persisted.releaseDate,
    release_date: persisted.release_date,
    youtube_trailer: persisted.youtube_trailer,
  };
}

function seriesRuntimeItem(persisted: PersistedSeriesCatalogItem): XtreamSeriesItem {
  return {
    series_id: persisted.series_id,
    name: persisted.name,
    cover: persisted.cover,
    plot: persisted.plot,
    cast: persisted.cast,
    director: persisted.director,
    genre: persisted.genre,
    releaseDate: persisted.releaseDate,
    release_date: persisted.release_date,
    rating: persisted.rating,
    category_id: persisted.category_id,
    backdrop_path: persisted.backdrop_path,
  };
}

export async function getCachedLiveItems(
  provider: CatalogRuntimeProvider,
  categoryId?: string,
  limit?: number,
): Promise<Channel[]> {
  const rows = await getCachedPersistedItems(provider.id, "live", categoryId, limit);
  return rows
    .filter((row): row is PersistedLiveCatalogItem => row.catalogKind === "live")
    .map((row) => liveRuntimeItem(row, provider));
}

export async function getCachedVodItems(
  provider: CatalogRuntimeProvider,
  categoryId?: string,
  limit?: number,
): Promise<XtreamVodItem[]> {
  const rows = await getCachedPersistedItems(provider.id, "vod", categoryId, limit);
  return rows
    .filter((row): row is PersistedVodCatalogItem => row.catalogKind === "vod")
    .map(vodRuntimeItem);
}

export async function getCachedSeriesItems(
  provider: CatalogRuntimeProvider,
  categoryId?: string,
  limit?: number,
): Promise<XtreamSeriesItem[]> {
  const rows = await getCachedPersistedItems(provider.id, "series", categoryId, limit);
  return rows
    .filter((row): row is PersistedSeriesCatalogItem => row.catalogKind === "series")
    .map(seriesRuntimeItem);
}

export async function getNewCachedLiveItems(provider: CatalogRuntimeProvider, limit = 24) {
  const rows = await getNewCachedPersistedItems(provider.id, "live", limit);
  return rows
    .filter((row): row is PersistedLiveCatalogItem => row.catalogKind === "live")
    .map((row) => liveRuntimeItem(row, provider));
}

export async function getNewCachedVodItems(provider: CatalogRuntimeProvider, limit = 24) {
  const rows = await getNewCachedPersistedItems(provider.id, "vod", limit);
  return rows
    .filter((row): row is PersistedVodCatalogItem => row.catalogKind === "vod")
    .map(vodRuntimeItem);
}

export async function getNewCachedSeriesItems(provider: CatalogRuntimeProvider, limit = 24) {
  const rows = await getNewCachedPersistedItems(provider.id, "series", limit);
  return rows
    .filter((row): row is PersistedSeriesCatalogItem => row.catalogKind === "series")
    .map(seriesRuntimeItem);
}

export async function resolveCatalogRuntimeSource(
  source: string,
  provider: CatalogRuntimeProvider | null | undefined,
): Promise<string> {
  const ref = parseCatalogRuntimeSource(source);
  if (!ref) return source;
  if (!provider || provider.id !== ref.providerId) {
    throw new Error("Cached playback provider is unavailable.");
  }
  const credentials = requireXtreamCredentials(provider);
  if (ref.kind === "vod-direct") {
    const info = await getVodInfo(credentials, ref.streamId);
    const directSource = info.movie_data?.direct_source?.trim();
    if (!directSource || parseCatalogRuntimeSource(directSource)) {
      throw new Error("The cached direct playback address could not be refreshed.");
    }
    return directSource;
  }
  return source;
}
