kind = "mobile"
previewPath = "/"
title = "LegendStream XPlayer"
description = "A native Android TV-first IPTV player for legal user-supplied M3U, Xtream Codes, Stalker Portal, and XMLTV sources, with Live TV browsing and playback."
version = "1.0.0"
id = "artifacts/legendstream-xplayer"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22338

[services.development]
run = "pnpm --filter @workspace/legendstream-xplayer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legendstream-xplayer", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/legendstream-xplayer", "run", "serve" ]

[services.env]
PORT = "22338"
BASE_PATH = "/"
